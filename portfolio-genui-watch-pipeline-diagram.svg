<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Generative UI for Watch Face Pipeline</title>
  <desc id="desc">A high-level pipeline diagram showing context and design pack inputs, AI layout decisions, structured JSON, validation, and final watch-face rendering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2EA"/>
      <stop offset="0.52" stop-color="#F4F7F3"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <linearGradient id="agentFill" x1="434" y1="228" x2="760" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19363B"/>
      <stop offset="1" stop-color="#27585D"/>
    </linearGradient>
    <linearGradient id="watchFill" x1="1244" y1="202" x2="1444" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15191F"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#123033" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#30484C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 44px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #132B2F; letter-spacing: 0; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #52656A; letter-spacing: 0; }
      .eyebrow { font: 700 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #59706B; letter-spacing: 1.2px; }
      .agentEyebrow { font: 700 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #A6D0C4; letter-spacing: 1.2px; }
      .stepTitle { font: 700 29px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #142C31; letter-spacing: 0; }
      .stepBody { font: 500 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #56686C; letter-spacing: 0; }
      .agentTitle { font: 700 31px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .agentBody { font: 550 21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #D7E6E0; letter-spacing: 0; }
      .smallLabel { font: 650 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #35575A; letter-spacing: 0; }
      .watchTime { font: 700 50px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #F6F7F3; letter-spacing: 0; }
      .watchTiny { font: 650 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #B7C5C0; letter-spacing: 0; }
      .watchMetric { font: 700 22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #F6F7F3; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="102" cy="808" r="198" fill="#D9ECE4" opacity="0.34"/>
  <circle cx="1506" cy="104" r="222" fill="#DBEAF3" opacity="0.46"/>

  <text x="90" y="98" class="title">Generative UI for Watch Face Pipeline</text>
  <text x="92" y="136" class="subtitle">From user context and design-system rules to a validated, renderable watch face.</text>

  <g filter="url(#softShadow)">
    <rect x="86" y="222" width="286" height="150" rx="28" fill="#FFFFFF"/>
    <text x="116" y="268" class="eyebrow">INPUT</text>
    <text x="116" y="309" class="stepTitle">Live Context</text>
    <text x="116" y="342" class="stepBody">Time, location, activity,</text>
    <text x="116" y="370" class="stepBody">goal, and demo history</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="86" y="445" width="286" height="150" rx="28" fill="#FFFFFF"/>
    <text x="116" y="491" class="eyebrow">RULES</text>
    <text x="116" y="532" class="stepTitle">Design Pack</text>
    <text x="116" y="565" class="stepBody">Schema, components,</text>
    <text x="116" y="593" class="stepBody">icons, and layout rules</text>
  </g>

  <path d="M376 298C402 298 414 331 437 353" stroke="#30484C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M376 520C405 520 414 488 438 467" stroke="#30484C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="436" y="214" width="338" height="402" rx="34" fill="url(#agentFill)"/>
    <text x="474" y="271" class="agentEyebrow">AI DECISION LAYER</text>
    <text x="474" y="318" class="agentTitle">Layout Agent</text>

    <rect x="474" y="354" width="260" height="66" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="500" y="382" class="agentBody">Select content types</text>
    <text x="500" y="408" class="agentBody">max 3 useful widgets</text>

    <rect x="474" y="442" width="260" height="66" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="500" y="470" class="agentBody">Choose widget shape</text>
    <text x="500" y="496" class="agentBody">component and variant</text>

    <rect x="474" y="530" width="260" height="66" rx="19" fill="#FFFFFF" opacity="0.12"/>
    <text x="500" y="558" class="agentBody">Populate data and</text>
    <text x="500" y="584" class="agentBody">semantic icon tokens</text>
  </g>

  <path d="M778 415H812" stroke="#30484C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="824" y="280" width="250" height="270" rx="30" fill="#FEFCF8"/>
    <text x="856" y="329" class="eyebrow">OUTPUT</text>
    <text x="856" y="371" class="stepTitle">Structured</text>
    <text x="856" y="407" class="stepTitle">Layout JSON</text>
    <text x="856" y="450" class="stepBody">No custom code.</text>
    <text x="856" y="480" class="stepBody">Only approved</text>
    <text x="856" y="510" class="stepBody">render contracts.</text>
  </g>

  <path d="M1078 415H1121" stroke="#30484C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="1131" y="280" width="232" height="270" rx="30" fill="#FFFFFF"/>
    <text x="1161" y="329" class="eyebrow">GATE</text>
    <text x="1161" y="371" class="stepTitle">Validate</text>
    <text x="1161" y="414" class="stepBody">Schema checks</text>
    <text x="1161" y="444" class="stepBody">Rule checks</text>
    <text x="1161" y="474" class="stepBody">Retry or fallback</text>
    <rect x="1161" y="502" width="145" height="34" rx="17" fill="#DCEBE5"/>
    <text x="1183" y="525" class="smallLabel">safe to render</text>
  </g>

  <path d="M1247 553C1247 612 1218 652 1154 674C1042 712 830 710 676 666" stroke="#799793" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 13"/>
  <text x="688" y="699" class="smallLabel">Debug logs capture decisions, validation, retries, and fallback state</text>

  <path d="M1367 415H1374" stroke="#30484C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(1368 158)" filter="url(#softShadow)">
    <rect x="191" y="163" width="22" height="156" rx="11" fill="#232A31"/>
    <rect x="10" y="58" width="196" height="440" rx="74" fill="#222931"/>
    <rect x="28" y="78" width="160" height="400" rx="60" fill="url(#watchFill)"/>
    <text x="56" y="160" class="watchTiny">TUE 4</text>
    <text x="52" y="225" class="watchTime">8:42</text>

    <circle cx="70" cy="316" r="38" fill="#253136" stroke="#7BCEB5" stroke-width="8"/>
    <text x="49" y="323" class="watchMetric">72</text>
    <text x="44" y="357" class="watchTiny">BPM</text>

    <rect x="108" y="287" width="58" height="86" rx="25" fill="#162126" stroke="#E5B958" stroke-width="5"/>
    <text x="124" y="327" class="watchMetric">15</text>
    <text x="121" y="354" class="watchTiny">MIN</text>

    <rect x="45" y="393" width="118" height="50" rx="25" fill="#27343A"/>
    <text x="69" y="424" class="watchTiny">Walk home</text>
  </g>

  <text x="1368" y="746" class="eyebrow">RENDER</text>
  <text x="1368" y="789" class="stepTitle">Approved</text>
  <text x="1368" y="825" class="stepTitle">Components</text>
</svg>
