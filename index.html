<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenUI on watch face</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" />
    <style>
      :root {
        --page: #f5f2eb;
        --panel: #f1f1f1;
        --text: #000000;
        --line: #727272;
        --divider: #cbcbcb;
        --accent: #d94c00;
        --mono-bg: #ffffff;
        --font: "Roboto Slab", Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family: var(--font);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .page {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 640px;
        padding: 24px;
        overflow: hidden;
      }

      .masthead {
        flex: 0 0 auto;
        width: max-content;
        max-width: calc(100vw - 96px);
        margin-left: 16px;
      }

      .masthead h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(360px, 0.7fr) minmax(520px, 1fr);
        gap: 24px;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        margin-top: 24px;
      }

      .left-panels {
        display: grid;
        grid-template-rows: max-content minmax(0, 1fr);
        gap: 24px;
        min-width: 0;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid #cbcbcb;
        border-radius: 24px;
        background: var(--panel);
      }

      .context-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 16px;
        gap: 24px;
      }

      .panel-title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
      }

      .debug-header .panel-title {
        padding: 16px 0;
      }

      .context-form {
        display: grid;
        gap: 16px;
        width: 100%;
        min-height: 0;
        overflow: visible;
      }

      .field-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .field {
        display: grid;
        gap: 4px;
      }

      .field label {
        font-size: 16px;
        line-height: 1.2;
      }

      .field input,
      .field textarea {
        width: 100%;
        height: 45px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        outline: none;
        padding: 0 11px;
        font-size: 16px;
      }

      .field textarea {
        resize: none;
        padding-top: 11px;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: #000;
      }

      .generate-button {
        align-self: flex-start;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        padding: 12px;
        font-size: 16px;
        line-height: 1.2;
      }

      .copy-debug-button {
        align-self: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .copy-debug-button:focus-visible,
      .generate-button:focus-visible,
      .sample-layout-button:focus-visible,
      .debug-tab:focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }

      .context-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .sample-layout-button {
        align-self: flex-start;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        padding: 12px;
        font-size: 16px;
        line-height: 1.2;
      }

      .debug-panel {
        display: flex;
        flex-direction: column;
      }

      .debug-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--divider);
        padding: 0 16px;
      }

      .debug-tabs {
        display: flex;
        flex: 0 0 auto;
        align-self: stretch;
        align-items: stretch;
        justify-content: flex-end;
        margin-left: auto;
        overflow: hidden;
      }

      .debug-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 0;
        border-bottom: 4px solid transparent;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .debug-tab[aria-selected="true"] {
        border-bottom-color: #000;
        font-weight: 700;
      }

      .debug-content {
        flex: 1;
        min-height: 0;
        padding: 16px;
        overflow: hidden;
      }

      .debug-box {
        min-width: 0;
        height: 100%;
        overflow: auto;
      }

      .debug-box[hidden] {
        display: none;
      }

      .logs,
      .layout-json {
        margin: 0;
        min-height: 100%;
        padding: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .preview-panel {
        position: relative;
        min-height: 0;
      }

      .preview-credit {
        position: absolute;
        right: 16px;
        bottom: 16px;
        margin: 0;
        color: #505050;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
      }

      .watch-preview {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 470px;
        transform: translate(-50%, -50%);
      }

      .watch-image {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: block;
        width: 300px;
        height: 470px;
        object-fit: contain;
        pointer-events: none;
      }

      .gen-watch-face {
        position: absolute;
        z-index: 2;
        left: 47.5px;
        top: 109.5px;
        width: 205px;
        height: 251px;
        overflow: hidden;
        border: 0;
        border-radius: 54px;
        background: #000;
        box-shadow: 0 0 0 2px #000;
      }

      .watch-face-render {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      }

      .watch-el {
        position: absolute;
        min-width: 0;
      }

      .watch-date {
        left: 18px;
        top: 18px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
      }

      .watch-time {
        font-size: 64px;
        font-weight: 760;
        line-height: 0.9;
        letter-spacing: 0;
      }

      .watch-widget {
        position: absolute;
        color: #fff;
      }

      .circular-widget {
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .circular-widget svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .gauge-text {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        text-align: center;
        white-space: nowrap;
        letter-spacing: 0;
      }

      .gauge-value,
      .gauge-label {
        font-weight: 457;
      }

      .gauge-label {
        text-transform: lowercase;
      }

      .gauge-icon {
        display: grid;
        place-items: center;
      }

      .rect-widget {
        overflow: hidden;
        width: 205px;
        border-radius: 54px;
        background: #000;
        color: #fff;
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .rect-inner {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 16px;
      }

      .rect-primary {
        overflow: hidden;
        font-size: 19px;
        font-weight: 600;
        line-height: 21.5px;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rect-secondary {
        overflow: hidden;
        color: rgba(242, 244, 252, 0.6);
        font-size: 19px;
        font-weight: 400;
        line-height: 21.5px;
        letter-spacing: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rect-radio-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .rect-radio {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        margin: 0;
        border: 0;
        border-radius: 999px;
      }

      .rect-radio-ring {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 2px solid #9ba0aa;
        border-radius: 999px;
      }

      .rect-radio-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #f2f4fc;
      }

      .rect-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .rect-control {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: transparent;
      }

      .rect-progress {
        width: 173px;
        height: 12px;
        overflow: hidden;
        border-radius: 0;
        background: rgba(242, 244, 252, 0.1);
      }

      .rect-progress-value {
        height: 100%;
        border-radius: inherit;
        background: var(--widget-accent, #d94c00);
      }

      .rect-number {
        font-size: 40px;
        font-weight: 400;
        line-height: 42.5px;
      }

      .checklist-list {
        position: absolute;
        left: 6px;
        top: 71px;
        display: grid;
        gap: 2px;
        width: 193px;
      }

      .checklist-item {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 193px;
        height: 56px;
        padding: 0 8px;
        border-radius: 8px;
        background: rgba(242, 244, 252, 0.1);
      }

      .watch-symbol {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Material Symbols Rounded";
        font-weight: 400;
        font-style: normal;
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        line-height: 1;
        user-select: none;
      }

      @media (max-width: 1080px) {
        .page {
          height: auto;
          min-height: 100vh;
          min-height: 100dvh;
          overflow: visible;
        }

        .panels {
          grid-template-columns: 1fr;
          min-height: 0;
          flex: none;
        }

        .left-panels {
          display: contents;
        }

        .context-panel {
          order: 1;
        }

        .preview-panel {
          order: 2;
        }

        .debug-panel {
          order: 3;
        }

        .debug-panel {
          min-height: 380px;
        }

        .preview-panel {
          min-height: 640px;
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 16px;
        }

        .masthead {
          width: auto;
          max-width: none;
          margin-left: 0;
        }

        .masthead h1 {
          font-size: 32px;
          white-space: normal;
        }

        .masthead p {
          font-size: 13px;
        }

        .panels {
          width: 100%;
          margin-top: 32px;
        }

        .field-row {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .debug-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
          padding: 0 16px 16px;
        }

        .copy-debug-button {
          align-self: flex-start;
        }

        .debug-tabs {
          width: 100%;
          margin-left: 0;
        }

        .debug-tab {
          justify-content: flex-start;
          padding: 12px 10px 10px 0;
          font-size: 13px;
        }

        .watch-preview {
          transform: translate(-50%, -50%);
        }
      }
    </style>
  </head>
  <body>
    <main class="page" data-node-id="649:2299" data-name="Web Simulator">
      <header class="masthead">
        <h1>GenUI on watch face</h1>
      </header>

      <section class="panels" data-node-id="650:2327" data-name="Panels">
        <div class="left-panels" data-node-id="650:2326" data-name="Left Panels">
          <section class="panel context-panel" data-node-id="650:2305" data-name="Context Input" aria-labelledby="context-title">
            <form class="context-form" id="context-form">
              <h2 class="panel-title" id="context-title">Context</h2>

              <div class="field-row" data-name="Time & Location">
                <div class="field">
                  <label for="time-of-day">Time of day</label>
                  <input id="time-of-day" name="timeOfDay" value="4:31 PM" required />
                </div>

                <div class="field">
                  <label for="location">Location</label>
                  <input id="location" name="location" value="Kirkland, WA" required />
                </div>
              </div>

              <div class="field">
                <label for="activity">Activity</label>
                <input id="activity" name="activity" value="running, etc." required />
              </div>

              <div class="field">
                <label for="goal">Goal (optional)</label>
                <input id="goal" name="goal" value="make it to dinner on time" />
              </div>
            </form>

            <div class="context-actions">
              <button class="generate-button" id="generate-button" type="submit" form="context-form">Generate</button>
              <button class="sample-layout-button" id="sample-layout-button" type="button">Load Sample Layout</button>
            </div>
          </section>

          <section class="panel debug-panel" data-node-id="650:2306" data-name="Debug" aria-labelledby="debug-title">
            <header class="debug-header" data-node-id="712:544" data-name="Header">
              <h2 class="panel-title" id="debug-title">Debug</h2>
              <button class="copy-debug-button" id="copy-debug-button" type="button">Copy Debug Bundle</button>
              <div class="debug-tabs" data-node-id="712:543" data-name="Toggle View" role="tablist" aria-label="Debug view">
                <button class="debug-tab" id="logs-tab" type="button" role="tab" aria-selected="true" aria-controls="logs-panel">Logs</button>
                <button class="debug-tab" id="json-tab" type="button" role="tab" aria-selected="false" aria-controls="json-panel">Generated Layout JSON</button>
              </div>
            </header>

            <div class="debug-content">
              <section class="debug-box" id="logs-panel" role="tabpanel" aria-labelledby="logs-tab">
                <pre class="logs" id="logs">[front-end] Static simulator loaded.
[front-end] Waiting for Generate.</pre>
              </section>

              <section class="debug-box" id="json-panel" role="tabpanel" aria-labelledby="json-tab" hidden>
                <pre class="layout-json" id="layout-json">{}</pre>
              </section>
            </div>
          </section>
        </div>

        <section class="panel preview-panel" data-node-id="650:2300" data-name="Preview Panel" aria-label="Preview">
          <div class="watch-preview" aria-label="Watch preview">
            <img class="watch-image" src="assets/watch-bezel.png" alt="" width="300" height="470" />
            <div class="gen-watch-face" data-node-id="650:2307" data-name="Gen Watch Face" aria-label="Gen Watch Face container">
            </div>
          </div>
          <p class="preview-credit">from Peiqi Tang, 2026</p>
        </section>
      </section>
    </main>

    <script>
      const timeField = document.querySelector("#time-of-day");
      const form = document.querySelector("#context-form");
      const logs = document.querySelector("#logs");
      const layoutJson = document.querySelector("#layout-json");
      const genWatchFace = document.querySelector(".gen-watch-face");
      const copyDebugButton = document.querySelector("#copy-debug-button");
      const sampleLayoutButton = document.querySelector("#sample-layout-button");
      const tabButtons = [...document.querySelectorAll(".debug-tab")];
      const tabPanels = [...document.querySelectorAll("[role='tabpanel']")];
      let latestDebugBundle = "";
      let nextSampleLayoutIndex = 0;

      const MATERIAL_SYMBOLS = {
        activity_mobility: "self_improvement",
        activity_sitting: "chair",
        activity_standing: "accessibility_new",
        activity_walking: "directions_walk",
        calendar: "calendar_month",
        checklist: "checklist",
        commute: "directions_car",
        heart_rate: "favorite",
        location: "location_on",
        map_navigation: "near_me",
        message: "chat_bubble",
        music: "music_note",
        sleep: "bedtime",
        thermometer: "thermometer",
        time: "alarm",
        timer: "timer",
        weather_cloudy: "cloud",
        weather_partly_cloudy: "partly_cloudy_day",
        weather_rain: "rainy",
        weather_rainy: "rainy",
        weather_snowy: "weather_snowy",
        weather_umbrella: "umbrella",
        weather_sunny: "clear_day",
        weather_windy: "air",
        workout_running: "directions_run",
        workout_strength: "fitness_center",
        workout_trail_run: "hiking"
      };

      const ACCENT_BY_CONTENT_TYPE = {
        weather: "#63D6FF",
        upcoming_event: "#7DD3FC",
        workout: "#FF7A1A",
        timer: "#FFD54A",
        heart_rate: "#FF4D6D",
        iot_control: "#8CE99A",
        music_control: "#B892FF",
        reminder: "#F2F4FC",
        checklist: "#F2F4FC"
      };

      const CIRCULAR_SIZE_TOKENS = {
        S: {
          diameter: 72,
          strokeWidth: 8,
          radius: 31.5,
          center: { x: 36, y: 36 },
          iconBox: { x: 20, y: 20, width: 32, height: 32 },
          closeText: {
            value: { fontSize: 22, box: { x: 9.6, y: 24.8, width: 52.8, height: 22.4 } },
            label: { fontSize: 10, box: { x: 16, y: 47.2, width: 40, height: 9.6 } }
          },
          openText: {
            current: { fontSize: 22, box: { x: 18, y: 23, width: 35, height: 25 } },
            low: { fontSize: 15, box: { x: 13.05, y: 54, width: 19, height: 18 }, align: "left" },
            high: { fontSize: 15, box: { x: 40.07, y: 54, width: 19, height: 18 }, align: "right" },
            reference: { fontSize: 15, box: { x: 26.54, y: 54, width: 18, height: 18 }, align: "center" }
          },
          measureDot: { diameter: 8.21, strokeWidth: 2 }
        },
        M: {
          diameter: 90,
          strokeWidth: 10,
          radius: 39.5,
          center: { x: 45, y: 45 },
          iconBox: { x: 26, y: 26, width: 38, height: 38 },
          closeText: {
            value: { fontSize: 32, box: { x: 12, y: 31, width: 66, height: 28 } },
            label: { fontSize: 15, box: { x: 20, y: 59, width: 50, height: 12 } }
          },
          openText: {
            current: { fontSize: 32, box: { x: 19, y: 27, width: 51, height: 35 } },
            low: { fontSize: 18, box: { x: 16.31, y: 69, width: 23, height: 21 }, align: "left" },
            high: { fontSize: 18, box: { x: 50.34, y: 69, width: 23, height: 21 }, align: "right" },
            reference: { fontSize: 18, box: { x: 34.43, y: 69, width: 21, height: 21 }, align: "center" }
          },
          measureDot: { diameter: 10.27, strokeWidth: 2 }
        },
        L: {
          diameter: 149,
          strokeWidth: 15,
          radius: 66.5,
          center: { x: 74.5, y: 74.5 },
          iconBox: { x: 42, y: 43, width: 64, height: 64 },
          closeText: {
            value: { fontSize: 42, box: { x: 41, y: 52, width: 67, height: 45 } },
            label: { fontSize: 18, box: { x: 57, y: 97, width: 35, height: 21 } }
          },
          openText: {
            current: { fontSize: 48, box: { x: 36, y: 52, width: 77, height: 45 } },
            low: { fontSize: 32, box: { x: 27, y: 104, width: 38, height: 45 }, align: "left" },
            high: { fontSize: 32, box: { x: 85, y: 104, width: 38, height: 45 }, align: "right" },
            reference: { fontSize: 32, box: { x: 57, y: 104, width: 35, height: 45 }, align: "center" }
          },
          measureDot: { diameter: 17, strokeWidth: 3 }
        }
      };

      function currentTimeLabel() {
        return new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" }).format(new Date());
      }

      function currentDateLabel() {
        const now = new Date();
        const weekday = new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(now);
        return `${weekday} ${now.getDate()}`;
      }

      function timeForFace(value) {
        const match = value.match(/(\d{1,2})(?::(\d{2}))?/);
        if (!match) return value;
        return `${match[1]}:${match[2] || "00"}`;
      }

      function readContext() {
        return {
          timeOfDay: form.timeOfDay.value.trim(),
          location: form.location.value.trim(),
          activity: form.activity.value.trim(),
          goal: form.goal.value.trim()
        };
      }

      function inferSelectedContentTypes(context) {
        const text = `${context.activity} ${context.goal}`.toLowerCase();
        const selected = [];

        if (/(checklist|shopping list|task list|packing list)/.test(text)) {
          return ["checklist"];
        }

        if (/(music|song|playlist|audio|podcast|playback)/.test(text)) {
          selected.push("music_control");
        }

        if (/(timer|countdown|pause|cancel|start timer|reset timer)/.test(text)) {
          selected.push("timer");
        }

        if (/(remind|reminder|todo|to-do|complete task|mark complete)/.test(text)) {
          selected.push("reminder");
        }

        if (/(run|running|walk|workout|gym|exercise|mobility)/.test(text)) {
          selected.push("workout");
        }

        if (/(dinner|meeting|appointment|pickup|commute|on time|schedule|call)/.test(text)) {
          selected.push("upcoming_event");
        }

        if (/(rain|weather|outside|outdoors|waterfront)/.test(text)) {
          selected.push("weather");
        }

        if (selected.length === 0) {
          selected.push("upcoming_event");
        }

        if (!selected.includes("weather") && selected.length < 3) {
          selected.push("weather");
        }

        return selected.slice(0, 3);
      }

      function shouldUseTimerRectangle(context) {
        const text = `${context.activity} ${context.goal}`.toLowerCase();
        return /(pause|cancel|start|control|action|reset|buttons|full timer)/.test(text);

      function deferredWidgetDecision(contentType) {
        const rectangularOnlyTypes = new Set([
          "activity_summary",
          "upcoming_event",
          "last_message",
          "map_navigation",
          "sleep_summary"
        ]);

        if (rectangularOnlyTypes.has(contentType)) {
          return `${contentType} -> deferred because this content type is rectangular-only and generated rectangular composition support starts in a later phase`;
        }

        return `${contentType} -> no approved widget mapping in the Phase 6 local mock`;
      }

      function omittedByCompositionDecision(contentType) {
        return `${contentType} -> omitted because a rectangular-present composition may render at most two widgets total`;
      }

      function fallbackReasonFromContext(context) {
        const text = `${context.activity} ${context.goal}`.toLowerCase();
        if (/(api failure|api error|server error|network failure)/.test(text)) return "api_failure";
        if (/(timeout|timed out|too slow)/.test(text)) return "timeout";
        if (/(invalid output|bad json|schema fail|validation fail)/.test(text)) return "invalid_output";
        if (/(budget|cost|quota|exhausted)/.test(text)) return "budget_exhausted";
        return "no_ai_provider";
      }

        return {
          no_ai_provider: "No AI provider is active in Phase 7, so deterministic fallback layout is used.",

          timeout: "Timeout simulated from context; deterministic fallback layout is used.",
          invalid_output: "Invalid output simulated from context; deterministic fallback layout is used.",
          budget_exhausted: "Budget exhausted simulated from context; deterministic fallback layout is used."
        }[reason] || "Deterministic fallback layout is used.";

        const mappedWidgets = selectedContentTypes.map((type) => widgetByType[type]).filter(Boolean);
        const hasRectangularWidget = mappedWidgets.some((widget) => widget.shape === "rectangular");

      function resolveColorSystem(widgets, selectedContentTypes) {
        const renderedContentTypes = [...new Set(widgets.map((widget) => widget.contentType))];
        const semanticCount = renderedContentTypes.length || new Set(selectedContentTypes).size;
        const primaryContentType = renderedContentTypes[0] || selectedContentTypes[0];

      function buildMockLayout(context, selectedContentTypes, widgets, options = {}) {
        const colorSystem = resolveColorSystem(widgets, selectedContentTypes);
        const timeAndDateColor = colorSystem.mode === "mono_tone" ? colorSystem.accentColor : "#FFFFFF";
        const placement = resolveTimeDatePlacement(widgets);
        return {
          schemaVersion: "1.0.0",
          targetContainer: "Gen Watch Face",
          metadata: {
            pipelinePhase: options.pipelinePhase || "phase-7-deterministic-fallbacks",
            provider: "local-mock",
            model: "none",
            promptVersion: options.promptVersion || "watch-face-phase-7-fallback",
            schemaVersion: "1.0.0",
            selectedContentTypes,
            retryCount: 0,
            fallbackUsed: Boolean(options.fallbackUsed),
            ...(options.fallbackId ? { fallbackId: options.fallbackId } : {}),
            ...(options.fallbackReason ? { fallbackReason: options.fallbackReason } : {}),
            contextSource: "live_context_plus_mock_pseudo_context",
            generationStepProvenance: [
              "read-live-context",
              "load-pseudo-context",
              "select-content-types",
              "choose-widgets",
              ...(options.fallbackUsed ? ["choose-fallback-layout"] : []),
              "populate-widgets",

            ]

            }
          },

              fontFamily: "SF Pro Text",

              fontWeight: 600,
              letterSpacing: 0,
              color: timeAndDateColor,
              treatment: "fill"
            }
          },
          widgets: widgets.map(({ decision, ...widget }) => widget),
          layers: {
            bottom: ["time", "date"],
            top: widgets.map((widget) => widget.id)
          }
        };
      }

      function makeValidationError(stage, code, path, message) {
        return { severity: "error", stage, code, path, message };
      }

      function estimateTextWidth(text, fontSize) {
        return String(text).length * fontSize * 0.58;
      }

      function validateLocalLayout(layout) {
        const errors = [];
        const warnings = [];

        if (layout.schemaVersion !== "1.0.0") {
          errors.push(makeValidationError("schema", "invalid_schema_version", "schemaVersion", "schemaVersion must be 1.0.0"));
        }
        if (layout.targetContainer !== "Gen Watch Face") {
          errors.push(makeValidationError("schema", "invalid_target_container", "targetContainer", "targetContainer must be Gen Watch Face"));
        }
        if (!["mono_tone", "multicolor"].includes(layout.colorSystem?.mode)) {
          errors.push(makeValidationError("schema", "invalid_color_system_mode", "colorSystem.mode", "colorSystem.mode must be mono_tone or multicolor"));
        }
        if (!/^#[0-9a-fA-F]{6}$/.test(layout.colorSystem?.accentColor || "")) {
          errors.push(makeValidationError("schema", "invalid_color_system_accent", "colorSystem.accentColor", "colorSystem.accentColor must be a 6-digit hex color"));
        }
        if (!Array.isArray(layout.widgets)) {
          errors.push(makeValidationError("schema", "widgets_not_array", "widgets", "widgets must be an array"));
        } else if (layout.widgets.length > 3) {
          errors.push(makeValidationError("schema", "too_many_widgets", "widgets", "widgets must contain at most 3 items"));
        }
        if (layout.metadata?.fallbackUsed) {
          if (typeof layout.metadata.fallbackId !== "string" || layout.metadata.fallbackId.length === 0) {
            errors.push(makeValidationError("schema", "missing_fallback_id", "metadata.fallbackId", "metadata.fallbackId is required when fallbackUsed is true"));
          }
          if (!["no_ai_provider", "api_failure", "timeout", "invalid_output", "budget_exhausted"].includes(layout.metadata.fallbackReason)) {
            errors.push(makeValidationError("schema", "invalid_fallback_reason", "metadata.fallbackReason", "metadata.fallbackReason is invalid"));
          }
        }

        for (const [path, textObject] of [["time", layout.time], ["date", layout.date]]) {
          if (!textObject?.frame || !textObject?.style) {
            errors.push(makeValidationError("schema", "missing_text_contract", path, `${path} must include frame and style`));
            continue;
          }
          if (textObject.frame.x < 0 || textObject.frame.y < 0 || textObject.frame.x + textObject.frame.width > 205 || textObject.frame.y + textObject.frame.height > 251) {
            errors.push(makeValidationError("rule", "frame_outside_canvas", `${path}.frame`, `${path} must fit inside the 205 x 251 canvas`));
          }
          if (estimateTextWidth(textObject.value, textObject.style.fontSize) > textObject.frame.width + 2) {
            errors.push(makeValidationError("rule", "text_overflow", `${path}.value`, `${path}.value is estimated to overflow its declared frame`));
          }
        }

        if (layout.date?.style?.fontSize > layout.time?.style?.fontSize * 0.45) {
          errors.push(makeValidationError("rule", "date_not_secondary", "date.style.fontSize", "date must remain visually secondary to time"));
        }

        if (Array.isArray(layout.widgets)) {
          const rectangularWidgetCount = layout.widgets.filter((widget) => widget.shape === "rectangular").length;
          const hasChecklistWidget = layout.widgets.some((widget) => widget.contentType === "checklist");
          if (hasChecklistWidget && layout.widgets.length !== 1) {
            errors.push(makeValidationError("rule", "checklist_must_be_only_widget", "widgets", "checklist layouts must contain exactly one widget"));
          } else if (rectangularWidgetCount > 0 && layout.widgets.length > 2) {
            errors.push(makeValidationError("rule", "rectangular_present_widget_cap", "widgets", "rectangular-present layouts must contain at most two widgets"));
          }

          for (const [index, widget] of layout.widgets.entries()) {
            const path = `widgets[${index}]`;
            if (widget.frame?.x < 0 || widget.frame?.y < 0 || widget.frame?.x + widget.frame?.width > 205 || widget.frame?.y + widget.frame?.height > 251) {
              errors.push(makeValidationError("rule", "frame_outside_canvas", `${path}.frame`, `${path}.frame must fit inside the 205 x 251 canvas`));
            }
            if (widget.shape === "circular" && !["close_gauge", "open_gauge"].includes(widget.component)) {
              errors.push(makeValidationError("schema", "unknown_circular_component", `${path}.component`, `${path}.component is invalid`));
            }
            if (widget.shape === "circular" && !["S", "M", "L"].includes(widget.variant?.size)) {
              errors.push(makeValidationError("schema", "invalid_circular_size", `${path}.variant.size`, `${path}.variant.size is invalid`));
            }
            if (widget.shape === "rectangular") {
              if (!["music_control", "reminder", "timer_rectangular", "checklist_full_face", "generated_rectangular_widget"].includes(widget.template)) {
                errors.push(makeValidationError("schema", "unknown_rectangular_template", `${path}.template`, `${path}.template is invalid`));
              }
              if (widget.frame?.x !== 0 || widget.frame?.width !== 205) {
                errors.push(makeValidationError("rule", "rectangular_full_width", `${path}.frame`, `${path}.frame must be x=0 and width=205`));
              }
              if (widget.frame?.height < 80 || widget.frame?.height > 251) {
                errors.push(makeValidationError("rule", "rectangular_height_range", `${path}.frame.height`, `${path}.frame.height must be between 80 and 251`));
              }
            }
          }

          for (const [path, textObject] of [["time", layout.time], ["date", layout.date]]) {
            if (!textObject?.frame) continue;
            for (const widget of layout.widgets) {
              const overlapDepth = rectOverlapDepth(textObject.frame, widget.frame);
              if (overlapDepth > 10) {
                errors.push(makeValidationError("rule", "widget_text_overlap_exceeds_limit", `${path}.frame`, `${path} overlaps ${widget.id} by ${Math.round(overlapDepth)}px`));
              }
            }
          }
        }

        return {
          ok: errors.length === 0,
          stage: errors.some((item) => item.stage === "schema") ? "schema" : errors.length > 0 ? "rule" : "accepted",
          summary: errors.length === 0 ? "layout accepted by Phase 6 local validation" : `${errors.length} validation error${errors.length === 1 ? "" : "s"}`,
          errors,
          warnings
        };
      }

      function buildPipelineRun(reason) {
        const startedAt = performance.now();
        const context = readContext();
        const pseudoContextSummary = [
          "Fictional busy active user based in Kirkland, WA.",
          "Past context includes schedule, weather-aware planning, workouts, errands, commute, and evening routines."
        ];
        const selectedContentTypes = inferSelectedContentTypes(context);
        const fallbackReason = fallbackReasonFromContext(context);
        const fallbackId = chooseFallbackId(selectedContentTypes);
        const widgets = buildFallbackWidgets(fallbackId, context);
        const layout = buildMockLayout(context, selectedContentTypes, widgets, {
          fallbackUsed: true,
          fallbackId,
          fallbackReason
        });
        const elapsedMs = Math.round(performance.now() - startedAt);
        const widgetDecisions = widgets.map((widget) => widget.decision);
        const renderedContentTypes = new Set(widgets.map((widget) => widget.contentType));
        for (const contentType of selectedContentTypes) {
          if (!renderedContentTypes.has(contentType)) {
            const omittedByComposition = selectedContentTypes.some((type) => widgets.some((widget) => widget.contentType === type && widget.shape === "rectangular"));
            widgetDecisions.push(omittedByComposition ? omittedByCompositionDecision(contentType) : deferredWidgetDecision(contentType));
          }
        }
        const validation = validateLocalLayout(layout);
        const model = {
          provider: layout.metadata.provider,
          model: layout.metadata.model,
          promptVersion: layout.metadata.promptVersion,
          schemaVersion: layout.metadata.schemaVersion,
          latencyMs: elapsedMs,
          estimatedCost: "n/a"
        };
        const pipelineSteps = [
          { id: "read-live-context", status: "complete", detail: `time=${context.timeOfDay}; location=${context.location}; activity=${context.activity}; goal=${context.goal || "none"}` },
          { id: "load-pseudo-context", status: "mocked", detail: pseudoContextSummary.join(" ") },
          { id: "select-content-types", status: "complete", detail: selectedContentTypes.join(", ") },
          { id: "choose-fallback-layout", status: "complete", detail: `${fallbackId}; ${fallbackReasonLabel(fallbackReason)}` },
          { id: "choose-widgets", status: "complete", detail: widgetDecisions.join(" | ") },
          { id: "populate-widgets", status: "complete", detail: "Fallback widget data and semantic icon tokens populated from live context plus pseudo-context summary." },
          { id: "generate-layout-json", status: "complete", detail: "Generated schema-shaped Phase 7 fallback layout JSON as the final render contract." },
          { id: "validate", status: validation.ok ? "accepted" : "failed", detail: validation.summary },
          { id: "render", status: validation.ok ? "pending" : "blocked", detail: validation.ok ? "Awaiting accepted layout render." : "Render blocked because local validation failed." }
        ];

        return {
          generationId: `phase-7-${Date.now()}`,
          reason,
          context,
          pseudoContextSummary,
          selectedContentTypes,
          widgetDecisions,
          layout,
          validation,
          model,
          pipelineSteps
        };
      }

      function buildRunFromApiResponse(result, context, reason) {
        return {
          generationId: `phase-8-${Date.now()}`,
          reason,
          context,
          pseudoContextSummary: result.pseudoContextSummary || ["Loaded by backend endpoint."],
          selectedContentTypes: result.selectedContentTypes || result.layout?.metadata?.selectedContentTypes || [],
          widgetDecisions: result.widgetDecisions || [],
          layout: result.layout,
          validation: result.validation,
          model: result.model || {
            provider: result.layout?.metadata?.provider || "local-backend",
            model: "none",
            promptVersion: result.layout?.metadata?.promptVersion || "watch-face-phase-8-backend-fallback",
            schemaVersion: result.layout?.schemaVersion || "1.0.0",
            latencyMs: 0,
            estimatedCost: "n/a"
          },
          pipelineSteps: result.logs || []
        };
      }

      async function requestBackendGeneration(context) {
        const response = await fetch("/api/generate-watch-ui", {
          method: "POST",
          headers: {
            "content-type": "application/json"
          },
          body: JSON.stringify({
            context,
            currentTime: new Date().toISOString(),
            currentDate: new Date().toLocaleDateString("en-US"),
            preferences: {}
          })
        });
        const result = await response.json();
        if (!response.ok) {
          const summary = result.validation?.summary || `backend returned ${response.status}`;
          throw new Error(summary);
        }
        return result;
      }

      function buildSampleRun(layout, index) {
        const context = readContext();
        const pseudoContextSummary = [
          "Loaded from design-pack/sample-layouts.json.",
          "This bypasses content inference and exercises the deterministic Phase 6 validator and renderer."
        ];
        const widgetDecisions = layout.widgets.map((widget) => {
          if (widget.shape === "circular") {
            return `${widget.contentType} -> ${widget.component} ${widget.variant.property} ${widget.variant.size} from hand-authored sample ${index + 1}`;
          }
          return `${widget.contentType} -> ${widget.template} from hand-authored sample ${index + 1}`;
        });
        const validation = validateLocalLayout(layout);
        const model = {
          provider: "local-sample",
          model: "none",
          promptVersion: layout.metadata?.promptVersion || "watch-face-sample-v1",
          schemaVersion: layout.schemaVersion,
          latencyMs: 0,
          estimatedCost: "n/a"
        };
        return {
          generationId: `phase-6-sample-${Date.now()}`,
          reason: `Loaded hand-authored sample layout ${index + 1}.`,
          context,
          pseudoContextSummary,
          selectedContentTypes: layout.metadata?.selectedContentTypes || [],
          widgetDecisions,
          layout,
          validation,
          model,
          pipelineSteps: [
            { id: "load-sample-layouts", status: "complete", detail: "Fetched design-pack/sample-layouts.json as a static asset." },
            { id: "select-sample-layout", status: "complete", detail: `Selected sample layout ${index + 1}.` },
            { id: "generate-layout-json", status: "complete", detail: "Used hand-authored sample JSON as the final render contract." },
            { id: "validate", status: validation.ok ? "accepted" : "failed", detail: validation.summary },
            { id: "render", status: validation.ok ? "pending" : "blocked", detail: validation.ok ? "Awaiting accepted sample render." : "Render blocked because local validation failed." }
          ]
        };
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function polarToCartesian(center, radius, angleDegrees) {
        const radians = (angleDegrees * Math.PI) / 180;
        return {
          x: center.x + radius * Math.cos(radians),
          y: center.y + radius * Math.sin(radians)
        };
      }

      function describeArc(center, radius, startAngle, sweepAngle) {
        const endAngle = startAngle + sweepAngle;
        const start = polarToCartesian(center, radius, startAngle);
        const end = polarToCartesian(center, radius, endAngle);
        const largeArcFlag = Math.abs(sweepAngle) > 180 ? 1 : 0;
        return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
      }

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        return element;
      }

      function createElement(name, className, text) {
        const element = document.createElement(name);
        if (className) {
          element.className = className;
        }
        if (text !== undefined) {
          element.textContent = String(text);
        }
        return element;
      }

      function applyFrame(element, frame) {
        element.style.left = `${frame.x}px`;
        element.style.top = `${frame.y}px`;
        element.style.width = `${frame.width}px`;
        element.style.height = `${frame.height}px`;
      }

      function applyTextBox(element, token, color) {
        element.style.left = `${token.box.x}px`;
        element.style.top = `${token.box.y}px`;
        element.style.width = `${token.box.width}px`;
        element.style.height = `${token.box.height}px`;
        element.style.fontSize = `${token.fontSize}px`;
        element.style.lineHeight = `${token.box.height}px`;
        element.style.color = color;
        if (token.align) {
          element.style.justifyContent = token.align === "left" ? "flex-start" : token.align === "right" ? "flex-end" : "center";
        }
      }

      function accentFor(widget, colorSystem) {
        if (colorSystem?.mode === "mono_tone" && colorSystem.accentColor) {
          return colorSystem.accentColor;
        }
        return ACCENT_BY_CONTENT_TYPE[widget.contentType] || "#D94C00";
      }

      function hexToRgb(hex) {
        const normalized = hex.replace("#", "");
        const value = Number.parseInt(normalized.length === 3 ? normalized.split("").map((char) => char + char).join("") : normalized, 16);
        return {
          r: (value >> 16) & 255,
          g: (value >> 8) & 255,
          b: value & 255
        };
      }

      function rgbToHex({ r, g, b }) {
        return `#${[r, g, b].map((value) => Math.round(clamp(value, 0, 255)).toString(16).padStart(2, "0")).join("")}`;
      }

      function mixHex(start, end, amount) {
        const a = hexToRgb(start);
        const b = hexToRgb(end);
        return rgbToHex({
          r: a.r + (b.r - a.r) * amount,
          g: a.g + (b.g - a.g) * amount,
          b: a.b + (b.b - a.b) * amount
        });
      }

      function shiftColor(hex, amount) {
        return mixHex(hex, amount >= 0 ? "#FFFFFF" : "#000000", Math.abs(amount));
      }

      function colorsForWidget(widget, colorSystem) {
        const accent = accentFor(widget, colorSystem);
        if (widget.component === "open_gauge" && colorSystem?.mode === "multicolor") {
          return {
            accent,
            start: shiftColor(accent, 0.24),
            end: shiftColor(accent, -0.16),
            set: shiftColor(accent, 0.18),
            offset: shiftColor(accent, -0.12),
            usesGradient: true
          };
        }
        return {
          accent,
          start: accent,
          end: accent,
          set: accent,
          offset: accent,
          usesGradient: false
        };
      }

      function normalizeMetricValue(widget) {
        if (typeof widget.data.progress === "number") {
          return clamp(widget.data.progress, 0, 1);
        }
        const numericValue = Number.parseFloat(widget.data.measuredValue ?? widget.data.value);
        const min = Number(widget.data.min ?? 0);
        const max = Number(widget.data.max ?? 100);
        if (Number.isFinite(numericValue) && Number.isFinite(min) && Number.isFinite(max) && max !== min) {
          return clamp((numericValue - min) / (max - min), 0, 1);
        }
        return 0.5;
      }

      function renderMaterialIcon(token, size, color) {
        const icon = createElement("span", "watch-symbol", MATERIAL_SYMBOLS[token] || token || "help");
        icon.style.fontSize = `${size}px`;
        icon.style.color = color;
        icon.setAttribute("aria-hidden", "true");
        return icon;
      }

      function appendCloseGaugeContent(container, widget, sizeToken, color) {
        if (widget.variant.property === "icon") {
          const box = createElement("div", "gauge-text gauge-icon");
          applyTextBox(box, { ...sizeToken.iconBox, box: sizeToken.iconBox, fontSize: sizeToken.iconBox.width }, color);
          box.append(renderMaterialIcon(widget.data.icon, sizeToken.iconBox.width, color));
          container.append(box);
          return;
        }

        const value = createElement("div", "gauge-text gauge-value", widget.data.value);
        applyTextBox(value, sizeToken.closeText.value, color);
        const label = createElement("div", "gauge-text gauge-label", widget.data.label);
        applyTextBox(label, sizeToken.closeText.label, color);
        container.append(value, label);
      }

      function appendOpenGaugeContent(container, widget, sizeToken, colors, normalized) {
        const color = widget.variant.property === "offset" ? colors.offset : mixHex(colors.start, colors.end, normalized);
        if (widget.variant.property === "icon") {
          const box = createElement("div", "gauge-text gauge-icon");
          applyTextBox(box, { ...sizeToken.iconBox, box: sizeToken.iconBox, fontSize: sizeToken.iconBox.width }, color);
          box.append(renderMaterialIcon(widget.data.icon, sizeToken.iconBox.width, color));
          container.append(box);
          return;
        }

        const current = createElement("div", "gauge-text gauge-value", widget.data.value);
        applyTextBox(current, sizeToken.openText.current, color);
        container.append(current);

        if (widget.variant.property === "text" && widget.data.label) {
          const label = createElement("div", "gauge-text gauge-label", widget.data.label);
          applyTextBox(label, sizeToken.openText.reference, color);
          container.append(label);
        }

        if (widget.variant.property === "range") {
          const low = createElement("div", "gauge-text", widget.data.lowLabel ?? widget.data.min);
          applyTextBox(low, sizeToken.openText.low, colors.start);
          const high = createElement("div", "gauge-text", widget.data.highLabel ?? widget.data.max);
          applyTextBox(high, sizeToken.openText.high, colors.end);
          container.append(low, high);
        }

        if (widget.variant.property === "offset" && widget.data.referenceValue !== undefined) {
          const reference = createElement("div", "gauge-text", widget.data.referenceValue);
          applyTextBox(reference, sizeToken.openText.reference, colors.set);
          container.append(reference);
        }
      }

      function normalizedMetricFromValue(widget, rawValue) {
        const numericValue = Number.parseFloat(rawValue);
        const min = Number(widget.data.min ?? 0);
        const max = Number(widget.data.max ?? 100);
        if (Number.isFinite(numericValue) && Number.isFinite(min) && Number.isFinite(max) && max !== min) {
          return clamp((numericValue - min) / (max - min), 0, 1);
        }
        return 0.5;
      }

      function appendOpenGaugeDot(svg, sizeToken, normalized, fill) {
        const angle = 135 + normalized * 270;
        const point = polarToCartesian(sizeToken.center, sizeToken.radius, angle);
        svg.append(createSvgElement("circle", {
          cx: point.x,
          cy: point.y,
          r: sizeToken.measureDot.diameter / 2,
          fill,
          stroke: "#000",
          "stroke-width": sizeToken.measureDot.strokeWidth
        }));
      }

      function renderCircularWidget(widget, layout) {
        if (!["close_gauge", "open_gauge"].includes(widget.component)) {
          throw new Error(`Unknown circular component: ${widget.component}`);
        }
        if (!CIRCULAR_SIZE_TOKENS[widget.variant?.size]) {
          throw new Error(`Unknown circular size: ${widget.variant?.size}`);
        }

        const sizeToken = CIRCULAR_SIZE_TOKENS[widget.variant.size];
        const colors = colorsForWidget(widget, layout?.colorSystem);
        const color = colors.accent;
        const container = createElement("div", "watch-widget circular-widget");
        applyFrame(container, widget.frame);
        container.style.color = color;

        const svg = createSvgElement("svg", {
          viewBox: `0 0 ${sizeToken.diameter} ${sizeToken.diameter}`,
          role: "img",
          "aria-label": `${widget.contentType} ${widget.component}`
        });

        if (widget.component === "close_gauge") {
          const circumference = 2 * Math.PI * sizeToken.radius;
          const progress = normalizeMetricValue(widget);
          svg.append(
            createSvgElement("circle", {
              cx: sizeToken.center.x,
              cy: sizeToken.center.y,
              r: sizeToken.radius,
              fill: "none",
              stroke: "rgba(140, 140, 140, 0.28)",
              "stroke-width": sizeToken.strokeWidth,
              "stroke-linecap": "round"
            }),
            createSvgElement("circle", {
              cx: sizeToken.center.x,
              cy: sizeToken.center.y,
              r: sizeToken.radius,
              fill: "none",
              stroke: color,
              "stroke-width": sizeToken.strokeWidth,
              "stroke-linecap": "round",
              "stroke-dasharray": `${circumference * 0.833} ${circumference}`,
              "stroke-dashoffset": `${circumference * 0.833 * (1 - progress)}`,
              transform: `rotate(-90 ${sizeToken.center.x} ${sizeToken.center.y})`
            })
          );
          container.append(svg);
          appendCloseGaugeContent(container, widget, sizeToken, color);
          return container;
        }

        const normalized = normalizeMetricValue(widget);
        let progressStroke = color;
        if (colors.usesGradient) {
          const gradientId = `${widget.id || "open-gauge"}-gradient`;
          const defs = createSvgElement("defs");
          const gradient = createSvgElement("linearGradient", {
            id: gradientId,
            x1: "0%",
            y1: "100%",
            x2: "100%",
            y2: "100%"
          });
          gradient.append(
            createSvgElement("stop", { offset: "0%", "stop-color": widget.variant.property === "offset" ? colors.set : colors.start }),
            createSvgElement("stop", { offset: "100%", "stop-color": widget.variant.property === "offset" ? colors.offset : colors.end })
          );
          defs.append(gradient);
          svg.append(defs);
          progressStroke = `url(#${gradientId})`;
        }
        const trackPath = describeArc(sizeToken.center, sizeToken.radius, 135, 270);
        const progressPath = describeArc(sizeToken.center, sizeToken.radius, 135, 270 * normalized);
        svg.append(
          createSvgElement("path", {
            d: trackPath,
            fill: "none",
            stroke: "#3D3D3D",
            "stroke-width": sizeToken.strokeWidth,
            "stroke-linecap": "round"
          }),
          createSvgElement("path", {
            d: progressPath,
            fill: "none",
            stroke: progressStroke,
            "stroke-width": sizeToken.strokeWidth,
            "stroke-linecap": "round"
          })
        );

        if (widget.variant.property === "range") {
          appendOpenGaugeDot(svg, sizeToken, normalized, mixHex(colors.start, colors.end, normalized));
        }

        if (widget.variant.property === "offset") {
          appendOpenGaugeDot(svg, sizeToken, normalizedMetricFromValue(widget, widget.data.referenceMeasuredValue ?? widget.data.referenceValue), colors.set);
          appendOpenGaugeDot(svg, sizeToken, normalizedMetricFromValue(widget, widget.data.measuredValue ?? widget.data.value), colors.offset);
        }

        container.append(svg);
        appendOpenGaugeContent(container, widget, sizeToken, colors, normalized);
        return container;
      }

      function renderControlIcon(name, color = "#F2F4FC") {
        const symbolByName = {
          previous: "skip_previous",
          play: "play_arrow",
          playPause: "pause",
          next: "skip_next",
          reset: "restart_alt",
          startPause: "pause",
          cancel: "close"
        };
        const button = createElement("div", "rect-control");
        button.append(renderMaterialIcon(symbolByName[name], 28, color));
        return button;
      }

      function renderRadioButton(checked = false) {
        const radio = createElement("span", "rect-radio");
        const ring = createElement("span", "rect-radio-ring");
        if (checked) {
          ring.append(createElement("span", "rect-radio-dot"));
        }
        radio.append(ring);
        return radio;
      }

      function renderGeneratedTextBlock(block) {
        const classByUnit = {
          numbers: "rect-number",
          body_emphasis: "rect-primary",
          body: "rect-secondary",
          secondary: "rect-secondary"
        };
        const element = createElement("div", classByUnit[block.unit], block.text);
        element.style.textAlign = block.align || "left";
        if (block.maxLines === 2) {
          element.style.whiteSpace = "normal";
          element.style.display = "-webkit-box";
          element.style.WebkitLineClamp = "2";
          element.style.WebkitBoxOrient = "vertical";
        }
        return element;
      }

      function renderGeneratedInlineSmallIconText(block, color) {
        const row = createElement("div", "rect-radio-row");
        row.style.alignItems = "center";
        row.style.gap = "4px";
        const icon = renderMaterialIcon(block.icon, 24, color);
        icon.style.width = "24px";
        icon.style.height = "24px";
        icon.style.flex = "0 0 auto";
        const textClass = block.textUnit === "body_emphasis" ? "rect-primary" : "rect-secondary";
        row.append(icon, createElement("span", textClass, block.text));
        return row;
      }

      function renderGeneratedBigIconTextGroup(block, color) {
        const row = createElement("div", "rect-controls");
        row.style.justifyContent = "flex-start";
        row.style.gap = "8px";
        const icon = renderMaterialIcon(block.icon, 48, color);
        icon.style.width = "48px";
        icon.style.height = "48px";
        icon.style.flex = "0 0 auto";
        const textGroup = createElement("div", "");
        textGroup.style.display = "flex";
        textGroup.style.flexDirection = "column";
        textGroup.style.minWidth = "0";
        for (const textBlock of block.textGroup) {
          textGroup.append(renderGeneratedTextBlock(textBlock));
        }
        if (block.iconPosition === "right") {
          row.append(textGroup, icon);
        } else {
          row.append(icon, textGroup);
        }
        return row;
      }

      function renderGeneratedNumberTextLockup(block) {
        const row = createElement("div", "rect-radio-row");
        row.style.alignItems = "baseline";
        row.style.gap = "4px";
        row.append(createElement("span", "rect-number", block.value));
        if (block.unitLabel) {
          row.append(createElement("span", "rect-primary", block.unitLabel));
        }
        if (block.secondaryText) {
          row.append(createElement("span", "rect-secondary", block.secondaryText));
        }
        return row;
      }

      function renderGeneratedEdgeProgressBar(block) {
        const progress = createElement("div", "rect-progress");
        const value = createElement("div", "rect-progress-value");
        value.style.width = `${Math.round(clamp(block.progress, 0, 1) * 100)}%`;
        progress.append(value);
        if (block.edge === "top") {
          progress.style.order = "-1";
        }
        return progress;
      }

      function renderGeneratedRectangularBlock(block, color) {
        if (block.type === "text") {
          return renderGeneratedTextBlock(block);
        }
        if (block.type === "inline_small_icon_text") {
          return renderGeneratedInlineSmallIconText(block, color);
        }
        if (block.type === "big_icon_text_group") {
          return renderGeneratedBigIconTextGroup(block, color);
        }
        if (block.type === "number_text_lockup") {
          return renderGeneratedNumberTextLockup(block);
        }
        if (block.type === "edge_progress_bar") {
          return renderGeneratedEdgeProgressBar(block);
        }
        throw new Error(`Unknown generated rectangular block type: ${block.type}`);
      }

      function renderGeneratedRectangularWidget(widget, element, color) {
        if (!widget.composition?.blocks?.length) {
          throw new Error("Generated rectangular widget is missing composition blocks");
        }

        const inner = createElement("div", "rect-inner");
        inner.style.flexDirection = widget.composition.layout === "horizontal" ? "row" : "column";
        inner.style.gap = `${widget.composition.gap}px`;
        inner.style.padding = `${widget.composition.padding.top}px ${widget.composition.padding.right}px ${widget.composition.padding.bottom}px ${widget.composition.padding.left}px`;
        if (widget.composition.verticalAlignment === "center") {
          inner.style.justifyContent = "center";
        } else if (widget.composition.verticalAlignment === "bottom") {
          inner.style.justifyContent = "flex-end";
        }
        for (const block of widget.composition.blocks) {
          inner.append(renderGeneratedRectangularBlock(block, color));
        }
        element.append(inner);
        return element;
      }

      function renderRectangularWidget(widget, layout) {
        if (!["music_control", "reminder", "timer_rectangular", "checklist_full_face", "generated_rectangular_widget"].includes(widget.template)) {
          throw new Error(`Unknown rectangular template: ${widget.template}`);
        }

        const element = createElement("div", "watch-widget rect-widget");
        applyFrame(element, widget.frame);
        const color = accentFor(widget, layout?.colorSystem);
        element.style.setProperty("--widget-accent", color);

        if (widget.template === "generated_rectangular_widget") {
          return renderGeneratedRectangularWidget(widget, element, color);
        }

        if (widget.template === "checklist_full_face") {
          const date = createElement("div", "watch-el rect-secondary", layout.date.value);
          date.style.left = "16px";
          date.style.top = "16px";
          const time = createElement("div", "watch-el rect-secondary", layout.time.value);
          time.style.left = "139px";
          time.style.top = "16px";
          time.style.width = "50px";
          time.style.textAlign = "right";
          const title = createElement("div", "watch-el rect-primary", widget.data.label || "Checklist");
          title.style.left = "16px";
          title.style.top = "42px";
          title.style.width = "173px";
          const list = createElement("div", "checklist-list");
          const completedItems = new Set(widget.data.completedItems || []);
          for (const item of (widget.data.items || []).slice(0, 4)) {
            const row = createElement("div", "checklist-item");
            row.append(renderRadioButton(completedItems.has(item)), createElement("span", "rect-secondary", item));
            list.append(row);
          }
          element.append(date, time, title, list);
          return element;
        }

        const inner = createElement("div", "rect-inner");
        element.append(inner);

        if (widget.template === "music_control") {
          inner.style.paddingBottom = "0";
          inner.style.gap = "10px";
          inner.style.alignItems = "center";
          inner.append(
            createElement("div", "rect-primary", widget.data.song),
            createElement("div", "rect-secondary", widget.data.artist || widget.data.album || "Now playing")
          );
          const controls = createElement("div", "rect-controls");
          controls.style.width = "173px";
          controls.style.height = "48px";
          controls.append(
            renderControlIcon("previous", color),
            renderControlIcon(widget.data.playbackState === "paused" ? "play" : "playPause", color),
            renderControlIcon("next", color)
          );
          const progress = createElement("div", "rect-progress");
          const value = createElement("div", "rect-progress-value");
          value.style.width = `${Math.round(clamp(widget.data.progress ?? 0.42, 0, 1) * 100)}%`;
          progress.append(value);
          inner.append(controls, progress);
          return element;
        }

        if (widget.template === "reminder") {
          inner.style.gap = "8px";
          const metadata = createElement("div", "rect-secondary", widget.data.dueDatetime || widget.data.label || "Reminder");
          metadata.style.paddingLeft = "32px";
          metadata.style.width = "173px";
          metadata.style.height = "22px";
          const row = createElement("div", "rect-radio-row");
          row.style.width = "173px";
          const content = createElement("span", "rect-primary", widget.data.content);
          content.style.width = "140px";
          content.style.whiteSpace = "normal";
          content.style.display = "-webkit-box";
          content.style.WebkitLineClamp = "3";
          content.style.WebkitBoxOrient = "vertical";
          row.append(renderRadioButton(widget.data.completed), content);
          inner.append(metadata, row);
          return element;
        }

        if (widget.template === "timer_rectangular") {
          inner.style.gap = "16px";
          inner.style.alignItems = "center";
          inner.append(createElement("div", "rect-number", widget.data.countdown));
          const controls = createElement("div", "rect-controls");
          controls.style.width = "173px";
          controls.style.height = "48px";
          controls.append(
            renderControlIcon("reset", color),
            renderControlIcon(widget.data.running === false ? "play" : "playPause", color),
            renderControlIcon("cancel", color)
          );
          inner.append(controls);
          return element;
        }

        return element;
      }

      function rectOverlapDepth(a, b) {
        const xOverlap = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
        const yOverlap = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
        return Math.min(xOverlap, yOverlap);
      }

      function validateWidgetTextOverlap(layout, textObject, path) {
        for (const widget of layout.widgets) {
          const overlapDepth = rectOverlapDepth(textObject.frame, widget.frame);
          if (overlapDepth > 10) {
            throw new Error(`${path} overlaps ${widget.id} by ${Math.round(overlapDepth)}px; maximum controlled overlap is 10px`);
          }
        }
      }

      function validateRenderableLayout(layout) {
        if (layout.targetContainer !== "Gen Watch Face") {
          throw new Error("Layout targetContainer must be Gen Watch Face");
        }
        if (!["mono_tone", "multicolor"].includes(layout.colorSystem?.mode)) {
          throw new Error("Layout colorSystem.mode must be mono_tone or multicolor");
        }
        if (!/^#[0-9a-fA-F]{6}$/.test(layout.colorSystem?.accentColor || "")) {
          throw new Error("Layout colorSystem.accentColor must be a 6-digit hex color");
        }
        if (!Array.isArray(layout.widgets)) {
          throw new Error("Layout widgets must be an array");
        }
        for (const widget of layout.widgets) {
          if (widget.shape === "circular" && !["close_gauge", "open_gauge"].includes(widget.component)) {
            throw new Error(`Renderer rejected unknown circular component ${widget.component}`);
          }
          if (widget.shape === "rectangular" && !["music_control", "reminder", "timer_rectangular", "checklist_full_face", "generated_rectangular_widget"].includes(widget.template)) {
            throw new Error(`Renderer rejected unknown rectangular template ${widget.template}`);
          }
        }
        validateWidgetTextOverlap(layout, layout.time, "time");
        validateWidgetTextOverlap(layout, layout.date, "date");
      }

      function renderWatchFace(layout) {
        validateRenderableLayout(layout);
        genWatchFace.replaceChildren();
        const root = createElement("div", "watch-face-render");

        const time = createElement("div", "watch-el watch-time", layout.time.value);
        applyFrame(time, layout.time.frame);
        time.style.color = layout.time.style?.color || "#fff";
        time.style.fontSize = `${layout.time.style?.fontSize || 64}px`;
        time.style.fontWeight = layout.time.style?.fontWeight || 760;

        const date = createElement("div", "watch-el watch-date", layout.date.value);
        applyFrame(date, layout.date.frame);
        date.style.color = layout.date.style?.color || "rgba(255, 255, 255, 0.62)";
        date.style.fontSize = `${layout.date.style?.fontSize || 12}px`;
        date.style.fontWeight = layout.date.style?.fontWeight || 600;

        root.append(time, date);
        for (const widget of layout.widgets) {
          root.append(widget.shape === "circular" ? renderCircularWidget(widget, layout) : renderRectangularWidget(widget, layout));
        }
        genWatchFace.append(root);
      }

      function formatLogs(run) {
        const pipelinePhase = run.layout?.metadata?.pipelinePhase || "phase-unknown";
        return [
          `[${pipelinePhase}] Pipeline started.`,
          `[${pipelinePhase}] ${run.reason}`,
          "",
          ...run.pipelineSteps.map((step) => `[${step.id}] ${step.status}: ${step.detail}`),
          "",
          `[fallback] used=${run.layout.metadata.fallbackUsed}; id=${run.layout.metadata.fallbackId || "none"}; reason=${run.layout.metadata.fallbackReason || "none"}`,
          "",
          `[color-system] ${run.layout.colorSystem.mode}: accent ${run.layout.colorSystem.accentColor}, source ${run.layout.colorSystem.sourceRule}`,
          "",
          `[debug-split] Generated Layout JSON contains final render contract plus compact metadata.`,
          `[debug-split] Logs contain context summary, reasoning, validation status, retry/fallback status, and model metadata.`,
          `[copy-debug-bundle] Ready. Paste the copied bundle into Codex to diagnose generation, validation, or renderer issues.`
        ].join("\n");
      }

      function buildDebugBundle(run) {
        return [
          "## Watch UI Debug Bundle",
          "",
          "Paste this bundle into Codex and ask it to diagnose whether the issue is in layout generation, validation, or renderer code, then make the smallest safe fix.",
          "",
          `Generation ID: ${run.generationId}`,
          `Pipeline Phase: ${run.layout.metadata.pipelinePhase}`,
          "",
          "### Live Context",
          "```json",
          JSON.stringify(run.context, null, 2),
          "```",
          "",
          "### Pseudo-Context Summary",
          run.pseudoContextSummary.map((item) => `- ${item}`).join("\n"),
          "",
          "### Selected Content Types",
          "```json",
          JSON.stringify(run.selectedContentTypes, null, 2),
          "```",
          "",
          "### Widget Decisions",
          run.widgetDecisions.map((item) => `- ${item}`).join("\n"),
          "",
          "### Generated Layout JSON",
          "```json",
          JSON.stringify(run.layout, null, 2),
          "```",
          "",
          "### Validation",
          "```json",
          JSON.stringify(run.validation, null, 2),
          "```",
          "",
          "### Renderer Logs",
          "```txt",
          formatLogs(run),
          "```",
          "",
          "### Model Metadata",
          "```json",
          JSON.stringify(run.model, null, 2),
          "```"
        ].join("\n");
      }

      function setPipelineOutput(run) {
        if (!run.validation.ok) {
          genWatchFace.replaceChildren(createElement("div", "watch-face-render"));
          layoutJson.textContent = JSON.stringify(run.layout, null, 2);
          logs.textContent = formatLogs(run);
          latestDebugBundle = buildDebugBundle(run);
          return;
        }
        try {
          renderWatchFace(run.layout);
          const renderStep = run.pipelineSteps.find((step) => step.id === "render");
          if (renderStep) {
            renderStep.status = "complete";
            renderStep.detail = "Rendered accepted layout through deterministic watch-face DOM/SVG primitives.";
          }
        } catch (error) {
          genWatchFace.replaceChildren(createElement("div", "watch-face-render"));
          run.pipelineSteps.push({ id: "render-error", status: "failed", detail: error.message });
          run.validation = {
            ...run.validation,
            ok: false,
            stage: "renderer",
            rendererError: error.message
          };
        }
        layoutJson.textContent = JSON.stringify(run.layout, null, 2);
        logs.textContent = formatLogs(run);
        latestDebugBundle = buildDebugBundle(run);
      }

      function refreshStaticOutput(reason) {
        const run = buildPipelineRun(reason);
        setPipelineOutput(run);
      }

      async function loadSampleLayout() {
        try {
          const response = await fetch("design-pack/sample-layouts.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`sample layout request failed: ${response.status}`);
          }
          const samples = await response.json();
          const sampleIndex = nextSampleLayoutIndex % samples.layouts.length;
          const layout = samples.layouts?.[sampleIndex];
          if (!layout) {
            throw new Error(`sample-layouts.json does not contain layouts[${sampleIndex}]`);
          }
          nextSampleLayoutIndex += 1;
          setPipelineOutput(buildSampleRun(layout, sampleIndex));
        } catch (error) {
          logs.textContent = `${logs.textContent}\n[load-sample-layout] Failed: ${error.message}`;
        }
      }

      function copyTextWithFallback(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.setAttribute("readonly", "");
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        textArea.remove();
      }

      async function copyDebugBundle() {
        if (!latestDebugBundle) {
          return;
        }

        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(latestDebugBundle);
          } catch (error) {
            copyTextWithFallback(latestDebugBundle);
          }
        } else {
          copyTextWithFallback(latestDebugBundle);
        }

        logs.textContent = `${logs.textContent}\n[copy-debug-bundle] Copied debug bundle to clipboard.`;
      }

      timeField.value = currentTimeLabel();
      refreshStaticOutput("Default context rendered.");

      async function handleGenerate() {
        const context = readContext();
        try {
          const result = await requestBackendGeneration(context);
          setPipelineOutput(buildRunFromApiResponse(result, context, "Generate clicked; backend Phase 8 endpoint returned deterministic fallback layout."));
        } catch (error) {
          const run = buildPipelineRun("Generate clicked; backend endpoint unavailable, so browser-local deterministic fallback was used.");
          run.pipelineSteps.unshift({
            id: "call-backend-endpoint",
            status: "failed",
            detail: `/api/generate-watch-ui failed: ${error.message}`
          });
          setPipelineOutput(run);
        }
      }

      copyDebugButton.addEventListener("click", () => {
        copyDebugBundle().catch((error) => {
          logs.textContent = `${logs.textContent}\n[copy-debug-bundle] Failed to copy: ${error.message}`;
        });
      });

      sampleLayoutButton.addEventListener("click", () => {
        loadSampleLayout();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        handleGenerate();
      });

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          tabButtons.forEach((tab) => tab.setAttribute("aria-selected", String(tab === button)));
          tabPanels.forEach((panel) => {
            panel.hidden = panel.id !== button.getAttribute("aria-controls");
          });
        });
      });
    </script>
  </body>
</html>
