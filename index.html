        };
        const element = createElement("div", classByUnit[block.unit], block.text);
        element.style.textAlign = block.align || "left";
        return element;
      }

      function renderGeneratedInlineSmallIconText(block, color) {
        const row = createElement("div", "rect-radio-row");
        row.style.alignItems = "center";
        row.style.gap = "4px";
        const icon = renderMaterialIcon(block.icon, 24, color);
        icon.style.width = "24px";
        icon.style.height = "24px";
        icon.style.flex = "0 0 auto";
        const textClass = block.textUnit === "body_emphasis" ? "rect-primary" : "rect-secondary";
        const text = createElement("span", textClass, block.text);
        text.style.flex = "1 1 0";
        row.append(icon, text);
        return row;
      }

      function renderGeneratedBigIconTextGroup(block, color) {
        const row = createElement("div", "rect-controls");
        row.style.justifyContent = "flex-start";
        row.style.gap = "8px";
        const icon = renderMaterialIcon(block.icon, 48, color);
        icon.style.width = "48px";
        icon.style.height = "48px";
        icon.style.flex = "0 0 auto";
        const textGroup = createElement("div", "");
        textGroup.style.display = "flex";
        textGroup.style.flexDirection = "column";
        textGroup.style.minWidth = "0";
        for (const textBlock of block.textGroup) {
          textGroup.append(renderGeneratedTextBlock(textBlock));
        }
        if (block.iconPosition === "right") {
          row.append(textGroup, icon);
        } else {
          row.append(icon, textGroup);
        }
        return row;
      }

      function renderGeneratedNumberTextLockup(block) {
        const row = createElement("div", "rect-radio-row");
        row.style.alignItems = "baseline";
        row.style.gap = "4px";
        row.append(createElement("span", "rect-number", block.value));
        if (block.unitLabel) {
          row.append(createElement("span", "rect-primary", block.unitLabel));
        }
        if (block.secondaryText) {
          const secondary = createElement("span", "rect-secondary", block.secondaryText);
          secondary.style.flex = "1 1 100%";
          row.append(secondary);
        }
        return row;
      }

      function renderGeneratedEdgeProgressBar(block) {
        const progress = createElement("div", "rect-progress");
        const value = createElement("div", "rect-progress-value");
        value.style.width = `${Math.round(clamp(block.progress, 0, 1) * 100)}%`;
        progress.append(value);
        if (block.edge === "top") {
          progress.style.order = "-1";
        }
        return progress;
      }

      function renderGeneratedRectangularBlock(block, color) {
        if (block.type === "text") {
          return renderGeneratedTextBlock(block);
        }
        if (block.type === "inline_small_icon_text") {
          return renderGeneratedInlineSmallIconText(block, color);
        }
        if (block.type === "big_icon_text_group") {
          return renderGeneratedBigIconTextGroup(block, color);
        }
        if (block.type === "number_text_lockup") {
          return renderGeneratedNumberTextLockup(block);
        }
        if (block.type === "edge_progress_bar") {
          return renderGeneratedEdgeProgressBar(block);
        }
        throw new Error(`Unknown generated rectangular block type: ${block.type}`);
      }

      function renderGeneratedRectangularWidget(widget, element, color) {
        if (!widget.composition?.blocks?.length) {
          throw new Error("Generated rectangular widget is missing composition blocks");
        }

        const inner = createElement("div", "rect-inner");
        inner.style.flexDirection = widget.composition.layout === "horizontal" ? "row" : "column";
        inner.style.gap = `${widget.composition.gap}px`;
        inner.style.padding = `${widget.composition.padding.top}px ${widget.composition.padding.right}px ${widget.composition.padding.bottom}px ${widget.composition.padding.left}px`;
        if (widget.composition.verticalAlignment === "center") {
          inner.style.justifyContent = "center";
        } else if (widget.composition.verticalAlignment === "bottom") {
          inner.style.justifyContent = "flex-end";
        }
        for (const block of widget.composition.blocks) {
          inner.append(renderGeneratedRectangularBlock(block, color));
        }
        element.append(inner);
        return element;
      }

      function renderRectangularWidget(widget, layout) {
        if (!["music_control", "reminder", "timer_rectangular", "checklist_full_face", "generated_rectangular_widget"].includes(widget.template)) {
          throw new Error(`Unknown rectangular template: ${widget.template}`);
        }

        const element = createElement("div", "watch-widget rect-widget");
        const renderFrame = widget.template === "checklist_full_face"
          ? { x: 0, y: 0, width: 205, height: 251 }
          : widget.frame;
        applyFrame(element, renderFrame);
        const rectColors = rectangularColorsFor(widget, layout?.colorSystem);
        element.style.setProperty("--widget-accent", rectColors.accent);
        element.style.setProperty("--rect-background", rectColors.background);
        element.style.setProperty("--rect-primary", rectColors.primary);
        element.style.setProperty("--rect-secondary", rectColors.secondary);
        element.style.setProperty("--rect-progress-value", rectColors.progress);
        element.style.setProperty("--rect-radio-stroke", rectColors.radioStroke);
        element.style.setProperty("--rect-radio-selected", rectColors.radioSelected);

        if (widget.template === "generated_rectangular_widget") {
          return renderGeneratedRectangularWidget(widget, element, rectColors.icon);
        }

        if (widget.template === "checklist_full_face") {
          const date = createElement("div", "watch-el rect-secondary", layout.date.value);
          date.style.left = "16px";
          date.style.top = "16px";
          const time = createElement("div", "watch-el rect-secondary", layout.time.value);
          time.style.left = "139px";
          time.style.top = "16px";
          time.style.width = "50px";
          time.style.textAlign = "right";
          const title = createElement("div", "watch-el rect-primary", widget.data.title || widget.data.label || "Checklist");
          title.style.left = "16px";
          title.style.top = "42px";
          title.style.width = "173px";
          const list = createElement("div", "checklist-list");
          const completedItems = new Set(widget.data.completedItems || []);
          for (const item of (widget.data.items || []).slice(0, 4)) {
            const itemText = typeof item === "string" ? item : item?.text || item?.label || "";
            const itemId = typeof item === "string" ? item : item?.id || itemText;
            const checked = Boolean(item?.checked || item?.completed || completedItems.has(itemId) || completedItems.has(itemText));
            const row = createElement("div", "checklist-item");
            row.append(renderRadioButton(checked), createElement("span", "rect-secondary", itemText));
            list.append(row);
          }
          element.append(date, time, title, list);
          return element;
        }

        const inner = createElement("div", "rect-inner");
        element.append(inner);

        if (widget.template === "music_control") {
          inner.style.paddingBottom = "0";
          inner.style.gap = "10px";
          inner.style.alignItems = "center";
          inner.append(
            createElement("div", "rect-primary", widget.data.song),
            createElement("div", "rect-secondary", widget.data.artist || widget.data.album || "Now playing")
          );
          const controls = createElement("div", "rect-controls");
          controls.style.width = "173px";
          controls.style.height = "48px";
          controls.append(
            renderControlIcon("previous", rectColors.icon),
            renderControlIcon(widget.data.playbackState === "paused" ? "play" : "playPause", rectColors.icon),
            renderControlIcon("next", rectColors.icon)
          );
          const progress = createElement("div", "rect-progress");
          const value = createElement("div", "rect-progress-value");
          value.style.width = `${Math.round(clamp(widget.data.progress ?? 0.42, 0, 1) * 100)}%`;
          progress.append(value);
          inner.append(controls, progress);
          return element;
        }

        if (widget.template === "reminder") {
          inner.style.gap = "8px";
          const metadata = createElement("div", "rect-secondary", "Reminder");
          metadata.style.paddingLeft = "32px";
          metadata.style.width = "173px";
          metadata.style.height = "22px";
          const row = createElement("div", "rect-radio-row");
          row.style.width = "173px";
          const content = createElement("span", "rect-primary", widget.data.content);
          content.style.width = "140px";
          content.style.whiteSpace = "normal";
          row.append(renderRadioButton(widget.data.completed), content);
          inner.append(metadata, row);
          return element;
        }

        if (widget.template === "timer_rectangular") {
          inner.style.gap = "16px";
          inner.style.alignItems = "center";
          inner.append(createElement("div", "rect-number", widget.data.countdown));
          const controls = createElement("div", "rect-controls");
          controls.style.width = "173px";
          controls.style.height = "48px";
          controls.append(
            renderControlIcon("reset", rectColors.icon),
            renderControlIcon(widget.data.running === false ? "play" : "playPause", rectColors.icon),
            renderControlIcon("cancel", rectColors.icon)
          );
          inner.append(controls);
          return element;
        }

        return element;
      }

      function rectOverlapDepth(a, b) {
        const xOverlap = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
        const yOverlap = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
        return Math.min(xOverlap, yOverlap);
      }

      function validateWidgetTextOverlap(layout, textObject, path) {
        for (const widget of layout.widgets) {
          if (widget.template === "checklist_full_face") continue;
          const xOverlap = Math.max(0, Math.min(textObject.frame.x + textObject.frame.width, widget.frame.x + widget.frame.width) - Math.max(textObject.frame.x, widget.frame.x));
          const yOverlap = Math.max(0, Math.min(textObject.frame.y + textObject.frame.height, widget.frame.y + widget.frame.height) - Math.max(textObject.frame.y, widget.frame.y));
          if (path === "date" && xOverlap > 0 && yOverlap > 0) {
            throw new Error(`date overlaps ${widget.id}; only time/widget overlap is allowed`);
          }
          const overlapDepth = rectOverlapDepth(textObject.frame, widget.frame);
          if (overlapDepth > 10) {
            throw new Error(`${path} overlaps ${widget.id} by ${Math.round(overlapDepth)}px; maximum controlled overlap is 10px`);
          }
        }
      }

      function renderableTextObjects(layout) {
        const timeObjects = Array.isArray(layout.time?.containers)
          ? layout.time.containers.map((container, index) => [`time.containers[${index}]`, container])
          : [["time", layout.time]];
        return [...timeObjects, ["date", layout.date]];
      }

      function validateRenderableLayout(layout) {
        if (layout.targetContainer !== "Gen Watch Face") {
          throw new Error("Layout targetContainer must be Gen Watch Face");
        }
        if (!["mono_tone", "multicolor"].includes(layout.colorSystem?.mode)) {
          throw new Error("Layout colorSystem.mode must be mono_tone or multicolor");
        }
        if (!/^#[0-9a-fA-F]{6}$/.test(layout.colorSystem?.accentColor || "")) {
          throw new Error("Layout colorSystem.accentColor must be a 6-digit hex color");
        }
        if (!Array.isArray(layout.widgets)) {
          throw new Error("Layout widgets must be an array");
        }
        for (const widget of layout.widgets) {
          if (widget.shape === "circular" && !["close_gauge", "open_gauge"].includes(widget.component)) {
            throw new Error(`Renderer rejected unknown circular component ${widget.component}`);
          }
          if (widget.shape === "circular") {
            const expectedCircularSize = { S: 72, M: 90, L: 150 }[widget.variant?.size];
            if (!expectedCircularSize || widget.frame?.width !== expectedCircularSize || widget.frame?.height !== expectedCircularSize) {
              throw new Error(`Renderer rejected ${widget.id}; circular size ${widget.variant?.size} must render at its fixed Figma size`);
            }
            if (widget.component === "close_gauge" && widget.variant?.property === "text" && widget.data?.label !== undefined) {
              const footnoteToken = {
                S: { fontSize: 10, width: 40 },
                M: { fontSize: 15, width: 50 },
                L: { fontSize: 18, width: 80 }
              }[widget.variant?.size];
              if (footnoteToken && estimateTextWidth(widget.data.label, footnoteToken.fontSize) > footnoteToken.width + 2) {
                throw new Error(`Renderer rejected ${widget.id}; data.label must fit the ${widget.variant.size} close_gauge footnote text box`);
              }
            }
            if (widget.component === "close_gauge" && widget.variant?.property === "text" && widget.data?.value !== undefined) {
              const centerValueToken = {
                S: { fontSize: 22, width: 55 },
                M: { fontSize: 32, width: 65 },
                L: { fontSize: 42, width: 115 }
              }[widget.variant?.size];
              if (centerValueToken && estimateTextWidth(widget.data.value, centerValueToken.fontSize) > centerValueToken.width + 2) {
                throw new Error(`Renderer rejected ${widget.id}; data.value must fit the ${widget.variant.size} close_gauge center value text box`);
              }
            }
            if (widget.component === "open_gauge") {
              if (widget.data?.value !== undefined) {
                const centerValueToken = {
                  S: { fontSize: 22, width: 55 },
                  M: { fontSize: 32, width: 65 },
                  L: { fontSize: 48, width: 115 }
                }[widget.variant?.size];
                if (centerValueToken && estimateTextWidth(widget.data.value, centerValueToken.fontSize) > centerValueToken.width + 2) {
                  throw new Error(`Renderer rejected ${widget.id}; data.value must fit the ${widget.variant.size} open_gauge center value text box`);
                }
              }
              const bottomTextToken = {
                S: { fontSize: 15, width: 48 },
                M: { fontSize: 18, width: 60 },
                L: { fontSize: 32, width: 96 }
              }[widget.variant?.size];
              const assertBottomText = (value, fieldName) => {
                if (isBlank(value)) {
                  throw new Error(`Renderer rejected ${widget.id}; ${fieldName} is required for visible open_gauge bottom content`);
                }
                if (bottomTextToken && estimateTextWidth(value, bottomTextToken.fontSize) > bottomTextToken.width + 2) {
                  throw new Error(`Renderer rejected ${widget.id}; ${fieldName} must fit the ${widget.variant.size} bottom text box at ${bottomTextToken.fontSize}pt`);
                }
              };
              if (widget.variant?.property === "text") assertBottomText(widget.data?.label, "data.label");
              if (widget.variant?.property === "range") {
                assertBottomText(widget.data?.lowLabel, "data.lowLabel");
                assertBottomText(widget.data?.highLabel, "data.highLabel");
              }
              if (widget.variant?.property === "offset") assertBottomText(widget.data?.referenceValue, "data.referenceValue");
              if (widget.variant?.property === "icon" && isBlank(widget.data?.value)) {
                throw new Error(`Renderer rejected ${widget.id}; data.value is required for open_gauge icon variant`);
              }
              if (widget.variant?.property === "icon" && isBlank(widget.data?.icon)) {
                throw new Error(`Renderer rejected ${widget.id}; data.icon is required for visible open_gauge icon content`);
              }
            }
          }
          if (widget.shape === "rectangular" && !["music_control", "reminder", "timer_rectangular", "checklist_full_face", "generated_rectangular_widget"].includes(widget.template)) {
            throw new Error(`Renderer rejected unknown rectangular template ${widget.template}`);
          }
          if (widget.template === "checklist_full_face") {
            const expectedFrame = { x: 0, y: 0, width: 205, height: 251 };
            for (const key of ["x", "y", "width", "height"]) {
              if (widget.frame?.[key] !== expectedFrame[key]) {
                throw new Error(`Renderer rejected ${widget.id}; checklist_full_face must render full screen with ${key}=${expectedFrame[key]}`);
              }
            }
            if (widget.verticalAlignment !== "top" || widget.surfaceMode !== "accent_surface") {
              throw new Error(`Renderer rejected ${widget.id}; checklist_full_face must use verticalAlignment top and surfaceMode accent_surface`);
            }
          }
        }
        for (let index = 0; index < layout.widgets.length; index += 1) {
          for (let nextIndex = index + 1; nextIndex < layout.widgets.length; nextIndex += 1) {
            const a = layout.widgets[index];
            const b = layout.widgets[nextIndex];
            const xOverlap = Math.max(0, Math.min(a.frame.x + a.frame.width, b.frame.x + b.frame.width) - Math.max(a.frame.x, b.frame.x));
            const yOverlap = Math.max(0, Math.min(a.frame.y + a.frame.height, b.frame.y + b.frame.height) - Math.max(a.frame.y, b.frame.y));
            if (xOverlap > 0 && yOverlap > 0) {
              throw new Error(`Renderer rejected ${a.id} and ${b.id}; widgets must not overlap`);
            }
          }
        }
        for (const [path, textObject] of renderableTextObjects(layout)) {
          validateWidgetTextOverlap(layout, textObject, path);
        }
      }

      function renderInvalidWidgetPlaceholder(widget, error) {
        const element = createElement("div", "watch-widget rect-widget");
        applyFrame(element, widget.frame || { x: 0, y: 0, width: 205, height: 108 });
        element.style.border = "1px solid rgba(255, 90, 95, 0.72)";
        element.style.background = "rgba(255, 90, 95, 0.14)";
        const inner = createElement("div", "rect-inner");
        inner.style.justifyContent = "center";
        inner.style.gap = "6px";
        inner.append(
          createElement("div", "rect-primary", widget.id || "Invalid widget"),
          createElement("div", "rect-secondary", error.message)
        );
        element.append(inner);
        return element;
      }

      function renderWatchFace(layout, options = {}) {
        const allowInvalidPreview = Boolean(options.allowInvalidPreview);
        if (!allowInvalidPreview) {
          validateRenderableLayout(layout);
        }
        genWatchFace.replaceChildren();
        const root = createElement("div", "watch-face-render");
        const hasChecklistFullFace = layout.widgets?.some((widget) => widget.template === "checklist_full_face");

        const timeElements = (Array.isArray(layout.time?.containers) ? layout.time.containers : [layout.time]).map((container) => {
          const time = createElement("div", "watch-el watch-time", container.value);
          applyFrame(time, container.frame);
          time.style.fontFamily = `"${container.style?.fontFamily || "SF Compact"}", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif`;
          time.style.color = container.style?.color || "#fff";
          time.style.fontSize = `${container.style?.fontSize || 64}px`;
          time.style.fontWeight = container.style?.fontWeight || 760;
          time.style.letterSpacing = `${container.style?.letterSpacing || 0}px`;
          time.style.textAlign = container.frame?.width === 205 ? "center" : container.style?.textAlign || "left";
          if (container.style?.treatment === "outline_stroke") {
            time.style.color = "transparent";
            time.style.webkitTextStroke = `1.5px ${container.style.color || "#fff"}`;
          }
          return time;
        });

        const date = createElement("div", "watch-el watch-date", layout.date.value);
        applyFrame(date, layout.date.frame);
        date.style.fontFamily = `"${layout.date.style?.fontFamily || "SF Compact"}", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif`;
        date.style.color = layout.date.style?.color || "rgba(255, 255, 255, 0.62)";
        date.style.fontSize = `${layout.date.style?.fontSize || 19}px`;
        date.style.fontWeight = layout.date.style?.fontWeight || 400;
        date.style.letterSpacing = `${layout.date.style?.letterSpacing || 0}px`;

        if (!hasChecklistFullFace) {
          root.append(...timeElements, date);
        }
        for (const widget of layout.widgets) {
          try {
            root.append(widget.shape === "circular" ? renderCircularWidget(widget, layout) : renderRectangularWidget(widget, layout));
          } catch (error) {
            if (!allowInvalidPreview) {
              throw error;
            }
            root.append(renderInvalidWidgetPlaceholder(widget, error));
          }
        }
        genWatchFace.append(root);
      }

      function formatLogs(run) {
        const pipelinePhase = run.layout?.metadata?.pipelinePhase || "phase-unknown";
        return [
          `[${pipelinePhase}] Pipeline started.`,
          `[${pipelinePhase}] ${run.reason}`,
          "",
          ...run.pipelineSteps.map((step) => `[${step.id}] ${step.status}: ${step.detail}`),
          "",
          `[validation] ok=${run.validation.ok}; stage=${run.validation.stage}; summary=${run.validation.summary}`,
          ...(run.validation.errors?.length ? run.validation.errors.map((item) => `[validation-error] ${item.path}: ${item.message}`) : []),
          "",
          `[fallback] used=${run.layout.metadata.fallbackUsed}; id=${run.layout.metadata.fallbackId || "none"}; reason=${run.layout.metadata.fallbackReason || "none"}`,
          `[invalid-preview] rendered=${Boolean(run.renderInvalidModelResult && !run.validation.ok)}`,
          "",
          `[color-system] ${run.layout.colorSystem.mode}: accent ${run.layout.colorSystem.accentColor}, source ${run.layout.colorSystem.sourceRule}`,
          "",
          `[debug-split] Generated Layout JSON contains final render contract plus compact metadata.`,
          `[debug-split] Logs contain context summary, reasoning, validation status, retry/fallback status, and model metadata.`,
          `[copy-debug-bundle] Ready. Paste the copied bundle into Codex to diagnose generation, validation, or renderer issues.`
        ].join("\n");
      }

      function buildDebugBundle(run) {
        return [
          "## Watch UI Debug Bundle",
          "",
          "Paste this bundle into Codex and ask it to diagnose whether the issue is in layout generation, validation, or renderer code, then make the smallest safe fix.",
          "",
          `Generation ID: ${run.generationId}`,
          `Pipeline Phase: ${run.layout.metadata.pipelinePhase}`,
          "",
          "### Live Context",
          "```json",
          JSON.stringify(run.context, null, 2),
          "```",
          "",
          "### Pseudo-Context Summary",
          run.pseudoContextSummary.map((item) => `- ${item}`).join("\n"),
          "",
          "### Selected Content Types",
          "```json",
          JSON.stringify(run.selectedContentTypes, null, 2),
          "```",
          "",
          "### Widget Decisions",
          run.widgetDecisions.map((item) => `- ${item}`).join("\n"),
          "",
          "### Generated Layout JSON",
          "```json",
          JSON.stringify(run.layout, null, 2),
          "```",
          "",
          "### Validation",
          "```json",
          JSON.stringify(run.validation, null, 2),
          "```",
          "",
          "### Validation Attempts",
          "```json",
          JSON.stringify(run.validationAttempts || [], null, 2),
          "```",
          "",
          "### Renderer Logs",
          "```txt",
          formatLogs(run),
          "```",
          "",
          "### Model Metadata",
          "```json",
          JSON.stringify(run.model, null, 2),
          "```"
        ].join("\n");
      }

      function setPipelineOutput(run) {
        if (!run.validation.ok && !run.renderInvalidModelResult) {
          genWatchFace.replaceChildren(createElement("div", "watch-face-render"));
          layoutJson.textContent = JSON.stringify(run.layout, null, 2);
          logs.textContent = formatLogs(run);
          latestDebugBundle = buildDebugBundle(run);
          return;
        }
        try {
          renderWatchFace(run.layout, { allowInvalidPreview: run.renderInvalidModelResult && !run.validation.ok });
          const renderStep = run.pipelineSteps.find((step) => step.id === "render");
          if (renderStep) {
            renderStep.status = "complete";
            renderStep.detail = run.validation.ok
              ? "Rendered accepted layout through deterministic watch-face DOM/SVG primitives."
              : "Rendered model layout despite validation failure; inspect debug validation errors before treating this output as accepted.";
          }
        } catch (error) {
          genWatchFace.replaceChildren(createElement("div", "watch-face-render"));
          run.pipelineSteps.push({ id: "render-error", status: "failed", detail: error.message });
          run.validation = {
            ...run.validation,
            ok: false,
            stage: "renderer",
            rendererError: error.message
          };
        }
        layoutJson.textContent = JSON.stringify(run.layout, null, 2);
        logs.textContent = formatLogs(run);
        latestDebugBundle = buildDebugBundle(run);
      }

      function showDebugPanel(panelId) {
        tabButtons.forEach((tab) => tab.setAttribute("aria-selected", String(tab.getAttribute("aria-controls") === panelId)));
        tabPanels.forEach((panel) => {
          panel.hidden = panel.id !== panelId;
        });
      }

      function renderWorkingState() {
        const loadingFace = createElement("div", "watch-face-render watch-loading");
        const spinner = createElement("div", "watch-loading-spinner");
        spinner.setAttribute("aria-hidden", "true");
        const label = createElement("div", "watch-loading-label", "Working...");
        loadingFace.append(spinner, label);
        genWatchFace.setAttribute("aria-busy", "true");
        genWatchFace.replaceChildren(loadingFace);
      }

      function setGenerateWorkingState(context) {
        isGenerating = true;
        generateButton.disabled = true;
        generateButton.setAttribute("aria-busy", "true");
        generateButton.textContent = "Generating...";
        showDebugPanel("logs-panel");
        layoutJson.textContent = "{}";
        latestDebugBundle = "";
        logs.textContent = [
          "[generate] Pipeline started.",
          "[generate] Cleared previous run logs.",
          `[generate] Context submitted: time=${context.timeOfDay}; location=${context.location}; activity=${context.activity}; goal=${context.goal || "none"}.`,
          "[generate] Pipeline is working. Please wait for an update."
        ].join("\n");
        renderWorkingState();
      }

      function clearGenerateWorkingState() {
        isGenerating = false;
        generateButton.disabled = false;
        generateButton.removeAttribute("aria-busy");
        generateButton.textContent = "Generate";
        genWatchFace.removeAttribute("aria-busy");
      }

      function setCopyDebugState(state, label) {
        window.clearTimeout(copyDebugResetTimer);
        copyDebugButton.dataset.copyState = state;
        copyDebugButton.textContent = label;
        if (state === "copied" || state === "failed") {
          copyDebugResetTimer = window.setTimeout(() => {
            delete copyDebugButton.dataset.copyState;
            copyDebugButton.textContent = "Copy Debug Bundle";
          }, 1600);
        }
      }

      function refreshStaticOutput(reason) {
        const run = buildPipelineRun(reason);
        setPipelineOutput(run);
      }

      async function loadSampleLayout() {
        try {
          const response = await fetch("design-pack/sample-layouts.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`sample layout request failed: ${response.status}`);
          }
          const samples = await response.json();
          const sampleIndex = nextSampleLayoutIndex % samples.layouts.length;
          const layout = samples.layouts?.[sampleIndex];
          if (!layout) {
            throw new Error(`sample-layouts.json does not contain layouts[${sampleIndex}]`);
          }
          nextSampleLayoutIndex += 1;
          setPipelineOutput(buildSampleRun(layout, sampleIndex));
        } catch (error) {
          logs.textContent = `${logs.textContent}\n[load-sample-layout] Failed: ${error.message}`;
        }
      }

      function copyTextWithFallback(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.setAttribute("readonly", "");
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        textArea.remove();
      }

      async function copyDebugBundle() {
        if (!latestDebugBundle) {
          setCopyDebugState("failed", "Nothing to copy");
          logs.textContent = `${logs.textContent}\n[copy-debug-bundle] Nothing to copy yet. Generate or load a layout first.`;
          return;
        }

        setCopyDebugState("copying", "Copying...");
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(latestDebugBundle);
          } catch (error) {
            copyTextWithFallback(latestDebugBundle);
          }
        } else {
          copyTextWithFallback(latestDebugBundle);
        }

        logs.textContent = `${logs.textContent}\n[copy-debug-bundle] Copied debug bundle to clipboard.`;
        setCopyDebugState("copied", "Debug bundle copied");
      }

      timeField.value = currentTimeLabel();
      refreshStaticOutput("Default context rendered.");

      async function handleGenerate() {
        if (isGenerating) {
          return;
        }
        const context = readContext();
        setGenerateWorkingState(context);
        try {
          const result = await requestBackendGeneration(context);
          const backendReason = result.renderInvalidModelResult
            ? "Generate clicked; backend returned an OpenAI layout that failed validation and is rendered for debugging."
            : result.layout?.metadata?.fallbackUsed
              ? "Generate clicked; backend returned deterministic fallback layout."
              : "Generate clicked; backend returned OpenAI layout.";
          setPipelineOutput(buildRunFromApiResponse(result, context, backendReason));
        } catch (error) {
          const reasonByKind = {
            validation: "Generate clicked; backend generation failed validation, so browser-local deterministic fallback was used.",
            request: "Generate clicked; backend rejected the generation request, so browser-local deterministic fallback was used.",
            server: "Generate clicked; backend returned a server error, so browser-local deterministic fallback was used.",
            network: "Generate clicked; backend endpoint unavailable, so browser-local deterministic fallback was used."
          };
          const run = buildPipelineRun(reasonByKind[error.kind] || reasonByKind.network);
          const validationDetails = error.result?.validation?.errors?.length
            ? `; ${error.result.validation.errors.map((item) => `${item.path}: ${item.message}`).join(" | ")}`
            : "";
          run.pipelineSteps.unshift({
            id: "call-backend-endpoint",
            status: "failed",
            detail: `/api/generate-watch-ui ${error.kind || "network"} failure${error.status ? ` (${error.status})` : ""}: ${error.message}${validationDetails}`
          });
          setPipelineOutput(run);
        } finally {
          clearGenerateWorkingState();
        }
      }

      copyDebugButton.addEventListener("click", () => {
        copyDebugBundle().catch((error) => {
          logs.textContent = `${logs.textContent}\n[copy-debug-bundle] Failed to copy: ${error.message}`;
          setCopyDebugState("failed", "Copy failed");
        });
      });

      sampleLayoutButton.addEventListener("click", () => {
        loadSampleLayout();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        handleGenerate();
      });

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          showDebugPanel(button.getAttribute("aria-controls"));
        });
      });
    </script>
  </body>
</html>
