<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenUI on watch face</title>
    <style>
      :root {
        --page: #f5f2eb;
        --panel: #f1f1f1;
        --text: #000000;
        --line: #727272;
        --divider: #cbcbcb;
        --accent: #d94c00;
        --mono-bg: #ffffff;
        --font: "Roboto Slab", Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family: var(--font);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .page {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 640px;
        padding: 24px;
        overflow: hidden;
      }

      .masthead {
        flex: 0 0 auto;
        width: max-content;
        max-width: calc(100vw - 96px);
        margin-left: 16px;
      }

      .masthead h1 {
        margin: 0;
        font-size: clamp(40px, 3.7vw, 64px);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(360px, 0.7fr) minmax(520px, 1fr);
        gap: 24px;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        margin-top: 24px;
      }

      .left-panels {
        display: grid;
        grid-template-rows: max-content minmax(0, 1fr);
        gap: 24px;
        min-width: 0;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid #cbcbcb;
        border-radius: 24px;
        background: var(--panel);
      }

      .context-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 16px;
        gap: 24px;
      }

      .panel-title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
      }

      .debug-header .panel-title {
        padding: 16px 0;
      }

      .context-form {
        display: grid;
        gap: 16px;
        width: 100%;
        min-height: 0;
        overflow: visible;
      }

      .field-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .field {
        display: grid;
        gap: 4px;
      }

      .field label {
        font-size: 16px;
        line-height: 1.2;
      }

      .field input,
      .field textarea {
        width: 100%;
        height: 45px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        outline: none;
        padding: 0 11px;
        font-size: 16px;
      }

      .field textarea {
        resize: none;
        padding-top: 11px;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: #000;
      }

      .generate-button {
        align-self: flex-start;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        padding: 12px;
        font-size: 16px;
        line-height: 1.2;
      }

      .debug-panel {
        display: flex;
        flex-direction: column;
      }

      .debug-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--divider);
        padding: 0 16px;
      }

      .debug-tabs {
        display: flex;
        flex: 0 0 auto;
        align-self: stretch;
        align-items: stretch;
        justify-content: flex-end;
        margin-left: auto;
        overflow: hidden;
      }

      .debug-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 0;
        border-bottom: 4px solid transparent;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .debug-tab[aria-selected="true"] {
        border-bottom-color: #000;
        font-weight: 700;
      }

      .debug-content {
        flex: 1;
        min-height: 0;
        padding: 16px;
        overflow: hidden;
      }

      .debug-box {
        min-width: 0;
        height: 100%;
        overflow: auto;
      }

      .debug-box[hidden] {
        display: none;
      }

      .logs,
      .layout-json {
        margin: 0;
        min-height: 100%;
        padding: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .preview-panel {
        position: relative;
        min-height: 0;
      }

      .preview-credit {
        position: absolute;
        right: 16px;
        bottom: 16px;
        margin: 0;
        color: #505050;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
      }

      .watch-preview {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 470px;
        transform: translate(-50%, -50%);
      }

      .watch-image {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: block;
        width: 300px;
        height: 470px;
        object-fit: contain;
        pointer-events: none;
      }

      .gen-watch-face {
        position: absolute;
        z-index: 2;
        left: 47.5px;
        top: 109.5px;
        width: 205px;
        height: 251px;
        overflow: hidden;
        border: 0;
        border-radius: 54px;
        background: #000;
        box-shadow: 0 0 0 2px #000;
      }

      .static-face {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 69% 20%, rgba(217, 76, 0, 0.18), transparent 29%),
          radial-gradient(circle at 18% 79%, rgba(255, 214, 99, 0.14), transparent 31%),
          #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      }

      .static-face-date {
        position: absolute;
        left: 18px;
        top: 18px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
        font-weight: 600;
      }

      .static-face-time {
        position: absolute;
        left: 18px;
        bottom: 32px;
        font-size: 64px;
        font-weight: 760;
        line-height: 0.9;
        letter-spacing: 0;
      }

      .static-face-chip {
        position: absolute;
        right: 15px;
        top: 21px;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border: 8px solid #d94c00;
        border-left-color: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }

      @media (max-width: 1080px) {
        .page {
          height: auto;
          min-height: 100vh;
          min-height: 100dvh;
          overflow: visible;
        }

        .panels {
          grid-template-columns: 1fr;
          min-height: 0;
          flex: none;
        }

        .left-panels {
          grid-template-rows: auto auto;
        }

        .debug-panel {
          min-height: 380px;
        }

        .preview-panel {
          min-height: 640px;
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 16px;
        }

        .masthead {
          width: auto;
          max-width: none;
          margin-left: 0;
        }

        .masthead h1 {
          white-space: normal;
        }

        .masthead p {
          font-size: 13px;
        }

        .panels {
          width: 100%;
          margin-top: 32px;
        }

        .field-row {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .debug-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
          padding: 0 16px 16px;
        }

        .debug-tabs {
          width: 100%;
          margin-left: 0;
        }

        .debug-tab {
          justify-content: flex-start;
          padding: 12px 10px 10px 0;
          font-size: 13px;
        }

        .watch-preview {
          transform: translate(-50%, -50%);
        }
      }
    </style>
  </head>
  <body>
    <main class="page" data-node-id="649:2299" data-name="Web Simulator">
      <header class="masthead">
        <h1>GenUI on watch face</h1>
      </header>

      <section class="panels" data-node-id="650:2327" data-name="Panels">
        <div class="left-panels" data-node-id="650:2326" data-name="Left Panels">
          <section class="panel context-panel" data-node-id="650:2305" data-name="Context Input" aria-labelledby="context-title">
            <form class="context-form" id="context-form">
              <h2 class="panel-title" id="context-title">Context</h2>

              <div class="field-row" data-name="Time & Location">
                <div class="field">
                  <label for="time-of-day">Time of day</label>
                  <input id="time-of-day" name="timeOfDay" value="4:31 PM" required />
                </div>

                <div class="field">
                  <label for="location">Location</label>
                  <input id="location" name="location" value="Kirkland, WA" required />
                </div>
              </div>

              <div class="field">
                <label for="activity">Activity</label>
                <input id="activity" name="activity" value="running, etc." required />
              </div>

              <div class="field">
                <label for="goal">Goal (optional)</label>
                <input id="goal" name="goal" value="make it to dinner on time" />
              </div>
            </form>

            <button class="generate-button" id="generate-button" type="button">Generate</button>
          </section>

          <section class="panel debug-panel" data-node-id="650:2306" data-name="Debug" aria-labelledby="debug-title">
            <header class="debug-header" data-node-id="712:544" data-name="Header">
              <h2 class="panel-title" id="debug-title">Debug</h2>
              <div class="debug-tabs" data-node-id="712:543" data-name="Toggle View" role="tablist" aria-label="Debug view">
                <button class="debug-tab" id="logs-tab" type="button" role="tab" aria-selected="true" aria-controls="logs-panel">Logs</button>
                <button class="debug-tab" id="json-tab" type="button" role="tab" aria-selected="false" aria-controls="json-panel">Generated Layout JSON</button>
              </div>
            </header>

            <div class="debug-content">
              <section class="debug-box" id="logs-panel" role="tabpanel" aria-labelledby="logs-tab">
                <pre class="logs" id="logs">[front-end] Static simulator loaded.
[front-end] Waiting for Generate.</pre>
              </section>

              <section class="debug-box" id="json-panel" role="tabpanel" aria-labelledby="json-tab" hidden>
                <pre class="layout-json" id="layout-json">{}</pre>
              </section>
            </div>
          </section>
        </div>

        <section class="panel preview-panel" data-node-id="650:2300" data-name="Preview Panel" aria-label="Preview">
          <div class="watch-preview" aria-label="Watch preview">
            <img class="watch-image" src="assets/watch-bezel.png" alt="" width="300" height="470" />
            <div class="gen-watch-face" data-node-id="650:2307" data-name="Gen Watch Face" aria-label="Gen Watch Face container">
              <div class="static-face">
                <span class="static-face-date" id="face-date">Tue 28</span>
                <span class="static-face-chip">42</span>
                <span class="static-face-time" id="face-time">4:31</span>
              </div>
            </div>
          </div>
          <p class="preview-credit">from Peiqi Tang, 2026</p>
        </section>
      </section>
    </main>

    <script>
      const timeField = document.querySelector("#time-of-day");
      const form = document.querySelector("#context-form");
      const logs = document.querySelector("#logs");
      const layoutJson = document.querySelector("#layout-json");
      const faceTime = document.querySelector("#face-time");
      const faceDate = document.querySelector("#face-date");
      const tabButtons = [...document.querySelectorAll(".debug-tab")];
      const tabPanels = [...document.querySelectorAll("[role='tabpanel']")];

      function currentTimeLabel() {
        return new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" }).format(new Date());
      }

      function currentDateLabel() {
        const now = new Date();
        const weekday = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(now);
        return `${weekday} ${now.getDate()}`;
      }

      function timeForFace(value) {
        const match = value.match(/(\d{1,2})(?::(\d{2}))?/);
        if (!match) return value;
        return `${match[1]}:${match[2] || "00"}`;
      }

      function readContext() {
        return {
          timeOfDay: form.timeOfDay.value.trim(),
          location: form.location.value.trim(),
          activity: form.activity.value.trim(),
          goal: form.goal.value.trim()
        };
      }

      function refreshStaticOutput(reason) {
        const context = readContext();
        const layout = {
          status: "static-front-end-placeholder",
          targetContainer: "Gen Watch Face",
          canvas: {
            width: 205,
            height: 251,
            borderRadius: 54
          },
          context
        };

        layoutJson.textContent = JSON.stringify(layout, null, 2);
        logs.textContent = [
          "[front-end] Static simulator loaded.",
          `[front-end] ${reason}`,
          "[front-end] Preview panel contains only the watch image and Gen Watch Face container."
        ].join("\n");
        faceTime.textContent = timeForFace(context.timeOfDay);
      }

      timeField.value = currentTimeLabel();
      faceDate.textContent = currentDateLabel();
      refreshStaticOutput("Default context rendered.");

      document.querySelector("#generate-button").addEventListener("click", () => {
        refreshStaticOutput("Generate clicked; captured form values for debug only.");
      });

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          tabButtons.forEach((tab) => tab.setAttribute("aria-selected", String(tab === button)));
          tabPanels.forEach((panel) => {
            panel.hidden = panel.id !== button.getAttribute("aria-controls");
          });
        });
      });
    </script>
  </body>
</html>
