<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenUI on watch face</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" />
    <style>
      :root {
        --page: #f5f2eb;
        --panel: #f1f1f1;
        --text: #000000;
        --line: #727272;
        --divider: #cbcbcb;
        --accent: #d94c00;
        --mono-bg: #ffffff;
        --font: "Roboto Slab", Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family: var(--font);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .page {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 640px;
        padding: 24px;
        overflow: hidden;
      }

      .masthead {
        flex: 0 0 auto;
        width: max-content;
        max-width: calc(100vw - 96px);
        margin-left: 16px;
      }

      .masthead h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(360px, 0.7fr) minmax(520px, 1fr);
        gap: 24px;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        margin-top: 24px;
      }

      .left-panels {
        display: grid;
        grid-template-rows: max-content minmax(0, 1fr);
        gap: 24px;
        min-width: 0;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid #cbcbcb;
        border-radius: 24px;
        background: var(--panel);
      }

      .context-panel {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 16px;
        gap: 24px;
      }

      .panel-title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.2;
      }

      .debug-header .panel-title {
        padding: 16px 0;
      }

      .context-form {
        display: grid;
        gap: 16px;
        width: 100%;
        min-height: 0;
        overflow: visible;
      }

      .field-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .field {
        display: grid;
        gap: 4px;
      }

      .field label {
        font-size: 16px;
        line-height: 1.2;
      }

      .field input,
      .field textarea {
        width: 100%;
        height: 45px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        outline: none;
        padding: 0 11px;
        font-size: 16px;
      }

      .field textarea {
        resize: none;
        padding-top: 11px;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: #000;
      }

      .generate-button {
        align-self: flex-start;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        padding: 12px;
        font-size: 16px;
        line-height: 1.2;
        box-shadow: 0 3px 0 #8f2f00;
        transition:
          background-color 120ms ease,
          box-shadow 120ms ease,
          transform 120ms ease;
      }

      .generate-button:hover {
        background: #c74400;
      }

      .generate-button:active {
        background: #9f3500;
        box-shadow: 0 1px 0 #6e2500;
        transform: translateY(2px);
      }

      .generate-button[aria-busy="true"] {
        background: #9f3500;
        box-shadow: 0 1px 0 #6e2500;
        cursor: wait;
        transform: translateY(2px);
      }

      .copy-debug-button {
        align-self: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        padding: 8px 10px;
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          box-shadow 120ms ease,
          color 120ms ease,
          transform 120ms ease;
      }

      .copy-debug-button:hover {
        background: rgba(0, 0, 0, 0.06);
        border-color: #000;
      }

      .copy-debug-button:active,
      .copy-debug-button[data-copy-state="copying"] {
        background: #000;
        border-color: #000;
        color: #fff;
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        transform: translateY(2px);
      }

      .copy-debug-button[data-copy-state="copied"] {
        background: #156b3a;
        border-color: #156b3a;
        color: #fff;
        box-shadow: 0 2px 0 #0b3d20;
      }

      .copy-debug-button[data-copy-state="failed"] {
        background: #9f3500;
        border-color: #9f3500;
        color: #fff;
        box-shadow: 0 2px 0 #6e2500;
      }

      .copy-debug-button:focus-visible,
      .generate-button:focus-visible,
      .sample-layout-button:focus-visible,
      .debug-tab:focus-visible {
        outline: 2px solid #000;
        outline-offset: 2px;
      }

      .context-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .sample-layout-button {
        align-self: flex-start;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        padding: 12px;
        font-size: 16px;
        line-height: 1.2;
      }

      .debug-panel {
        display: flex;
        flex-direction: column;
      }

      .debug-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-bottom: 1px solid var(--divider);
        padding: 0 16px;
      }

      .debug-tabs {
        display: flex;
        flex: 0 0 auto;
        align-self: stretch;
        align-items: stretch;
        justify-content: flex-end;
        margin-left: auto;
        overflow: hidden;
      }

      .debug-tab {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 0;
        border-bottom: 4px solid transparent;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .debug-tab[aria-selected="true"] {
        border-bottom-color: #000;
        font-weight: 700;
      }

      .debug-content {
        flex: 1;
        min-height: 0;
        padding: 16px;
        overflow: hidden;
      }

      .debug-box {
        min-width: 0;
        height: 100%;
        overflow: auto;
      }

      .debug-box[hidden] {
        display: none;
      }

      .logs,
      .layout-json {
        margin: 0;
        min-height: 100%;
        padding: 0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .preview-panel {
        position: relative;
        min-height: 0;
      }

      .preview-credit {
        position: absolute;
        right: 16px;
        bottom: 16px;
        margin: 0;
        color: #505050;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.2;
      }

      .watch-preview {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 470px;
        transform: translate(-50%, -50%);
      }

      .watch-image {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: block;
        width: 300px;
        height: 470px;
        object-fit: contain;
        pointer-events: none;
      }

      .gen-watch-face {
        position: absolute;
        z-index: 2;
        left: 47.5px;
        top: 109.5px;
        width: 205px;
        height: 251px;
        overflow: hidden;
        border: 0;
        border-radius: 54px;
        background: #000;
        box-shadow: 0 0 0 2px #000;
      }

      .watch-face-render {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      }

      .watch-loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 12px;
        align-content: center;
        background: radial-gradient(circle at 50% 42%, #171717 0%, #050505 68%);
        color: rgba(255, 255, 255, 0.78);
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0;
        text-align: center;
      }

      .watch-loading-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: #fff;
        border-radius: 999px;
        animation: watch-spin 850ms linear infinite;
      }

      @keyframes watch-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .watch-el {
        position: absolute;
        min-width: 0;
      }

      .watch-date {
        left: 18px;
        top: 18px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
      }

      .watch-time {
        font-size: 64px;
        font-weight: 760;
        line-height: 0.9;
        letter-spacing: 0;
      }

      .watch-widget {
        position: absolute;
        color: #fff;
      }

      .circular-widget {
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .circular-widget svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .gauge-text {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        text-align: center;
        white-space: nowrap;
        letter-spacing: 0;
      }

      .gauge-value,
      .gauge-label {
        font-weight: 457;
      }

      .gauge-label {
        text-transform: lowercase;
      }

      .gauge-icon {
        display: grid;
        place-items: center;
      }

      .rect-widget {
        overflow: hidden;
        width: 205px;
        border-radius: 54px;
        background: var(--rect-background, #000);
        color: var(--rect-primary, #fff);
        font-family: "SF Compact", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .rect-inner {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 16px;
      }

      .rect-primary {
        color: var(--rect-primary, #fff);
        font-size: 19px;
        font-weight: 600;
        line-height: 21.5px;
        letter-spacing: 0;
        min-width: 0;
        white-space: normal;
        overflow-wrap: break-word;
      }

      .rect-secondary {
        color: var(--rect-secondary, rgba(242, 244, 252, 0.6));
        font-size: 19px;
        font-weight: 400;
        line-height: 21.5px;
        letter-spacing: 0;
        min-width: 0;
        white-space: normal;
        overflow-wrap: break-word;
      }

      .rect-radio-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
      }

      .rect-radio {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        margin: 0;
        border: 0;
        border-radius: 999px;
      }

      .rect-radio-ring {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border: 2px solid var(--rect-radio-stroke, #9ba0aa);
        border-radius: 999px;
      }

      .rect-radio-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--rect-radio-selected, #f2f4fc);
      }

      .rect-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .rect-control {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: transparent;
      }

      .rect-progress {
        width: 173px;
        height: 12px;
        overflow: hidden;
        border-radius: 0;
        background: rgba(242, 244, 252, 0.1);
      }

      .rect-progress-value {
        height: 100%;
        border-radius: inherit;
        background: var(--rect-progress-value, var(--widget-accent, #d94c00));
      }

      .rect-number {
        flex: 0 0 auto;
        font-size: 40px;
        font-weight: 400;
        line-height: 42.5px;
      }

      .checklist-list {
        position: absolute;
        left: 6px;
        top: 71px;
        display: grid;
        gap: 2px;
        width: 193px;
      }

      .checklist-item {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 193px;
        height: 56px;
        padding: 0 8px;
        border-radius: 8px;
        background: rgba(242, 244, 252, 0.1);
      }

      .watch-symbol {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: "Material Symbols Rounded";
        font-weight: 400;
        font-style: normal;
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        line-height: 1;
        user-select: none;
      }

      @media (max-width: 1080px) {
        .page {
          height: auto;
          min-height: 100vh;
          min-height: 100dvh;
          overflow: visible;
        }

        .panels {
          grid-template-columns: 1fr;
          min-height: 0;
          flex: none;
        }

        .left-panels {
          display: contents;
        }

        .context-panel {
          order: 1;
        }

        .preview-panel {
          order: 2;
        }

        .debug-panel {
          order: 3;
        }

        .debug-panel {
          min-height: 380px;
        }

        .preview-panel {
          min-height: 640px;
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 16px;
        }

        .masthead {
          width: auto;
          max-width: none;
          margin-left: 0;
        }

        .masthead h1 {
          font-size: 32px;
          white-space: normal;
        }

        .masthead p {
          font-size: 13px;
        }

        .panels {
          width: 100%;
          margin-top: 32px;
        }

        .field-row {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .debug-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
          padding: 0 16px 16px;
        }

        .copy-debug-button {
          align-self: flex-start;
        }

        .debug-tabs {
          width: 100%;
          margin-left: 0;
        }

        .debug-tab {
          justify-content: flex-start;
          padding: 12px 10px 10px 0;
          font-size: 13px;
        }

        .watch-preview {
          transform: translate(-50%, -50%);
        }
      }
    </style>
  </head>
  <body>
    <main class="page" data-node-id="649:2299" data-name="Web Simulator">
      <header class="masthead">
        <h1>GenUI on watch face</h1>
      </header>

      <section class="panels" data-node-id="650:2327" data-name="Panels">
        <div class="left-panels" data-node-id="650:2326" data-name="Left Panels">
          <section class="panel context-panel" data-node-id="650:2305" data-name="Context Input" aria-labelledby="context-title">
            <form class="context-form" id="context-form">
              <h2 class="panel-title" id="context-title">Context</h2>

              <div class="field-row" data-name="Time & Location">
                <div class="field">
                  <label for="time-of-day">Time of day</label>
                  <input id="time-of-day" name="timeOfDay" value="4:31 PM" required />
                </div>

                <div class="field">
                  <label for="location">Location</label>
                  <input id="location" name="location" value="Kirkland, WA" required />
                </div>
              </div>

              <div class="field">
                <label for="activity">Activity</label>
                <input id="activity" name="activity" value="running, etc." required />
              </div>

              <div class="field">
                <label for="goal">Goal (optional)</label>
                <input id="goal" name="goal" value="make it to dinner on time" />
              </div>
            </form>

            <div class="context-actions">
              <button class="generate-button" id="generate-button" type="submit" form="context-form">Generate</button>
              <button class="sample-layout-button" id="sample-layout-button" type="button">Load Sample Layout</button>
            </div>
          </section>

          <section class="panel debug-panel" data-node-id="650:2306" data-name="Debug" aria-labelledby="debug-title">
            <header class="debug-header" data-node-id="712:544" data-name="Header">
              <h2 class="panel-title" id="debug-title">Debug</h2>
              <button class="copy-debug-button" id="copy-debug-button" type="button">Copy Debug Bundle</button>
              <div class="debug-tabs" data-node-id="712:543" data-name="Toggle View" role="tablist" aria-label="Debug view">
                <button class="debug-tab" id="logs-tab" type="button" role="tab" aria-selected="true" aria-controls="logs-panel">Logs</button>
                <button class="debug-tab" id="json-tab" type="button" role="tab" aria-selected="false" aria-controls="json-panel">Generated Layout JSON</button>
              </div>
            </header>

            <div class="debug-content">
              <section class="debug-box" id="logs-panel" role="tabpanel" aria-labelledby="logs-tab">
                <pre class="logs" id="logs">[front-end] Static simulator loaded.
[front-end] Waiting for Generate.</pre>
              </section>

              <section class="debug-box" id="json-panel" role="tabpanel" aria-labelledby="json-tab" hidden>
                <pre class="layout-json" id="layout-json">{}</pre>
              </section>
            </div>
          </section>
        </div>

        <section class="panel preview-panel" data-node-id="650:2300" data-name="Preview Panel" aria-label="Preview">
          <div class="watch-preview" aria-label="Watch preview">
            <img class="watch-image" src="assets/watch-bezel.png" alt="" width="300" height="470" />
            <div class="gen-watch-face" data-node-id="650:2307" data-name="Gen Watch Face" aria-label="Gen Watch Face container">
            </div>
          </div>
          <p class="preview-credit">from Peiqi Tang, 2026</p>
        </section>
      </section>
    </main>

    <script>
      const timeField = document.querySelector("#time-of-day");
      const form = document.querySelector("#context-form");
      const logs = document.querySelector("#logs");
      const layoutJson = document.querySelector("#layout-json");
      const genWatchFace = document.querySelector(".gen-watch-face");
      const generateButton = document.querySelector("#generate-button");
      const copyDebugButton = document.querySelector("#copy-debug-button");
      const sampleLayoutButton = document.querySelector("#sample-layout-button");
      const tabButtons = [...document.querySelectorAll(".debug-tab")];
      const tabPanels = [...document.querySelectorAll("[role='tabpanel']")];
      let latestDebugBundle = "";
      let nextSampleLayoutIndex = 0;
      let isGenerating = false;
      let copyDebugResetTimer = 0;

      const MATERIAL_SYMBOLS = {
        activity_mobility: "self_improvement",
        activity_sitting: "chair",
        activity_standing: "accessibility_new",
        activity_walking: "directions_walk",
        calendar: "calendar_month",
        checklist: "checklist",
        commute: "directions_car",
        heart_rate: "favorite",
        location: "location_on",
        map_navigation: "near_me",
        message: "chat_bubble",
        music: "music_note",
        sleep: "bedtime",
        thermometer: "thermometer",
        time: "alarm",
        timer: "timer",
        weather_cloudy: "cloud",
        weather_partly_cloudy: "partly_cloudy_day",
        weather_rain: "rainy",
        weather_rainy: "rainy",
        weather_snowy: "weather_snowy",
        weather_umbrella: "umbrella",
        weather_sunny: "clear_day",
        weather_windy: "air",
        workout_running: "directions_run",
        workout_strength: "fitness_center",
        workout_trail_run: "hiking"
      };

      const ACCENT_BY_CONTENT_TYPE = {
        weather: "#3CD3FE",
        upcoming_event: "#00D2E0",
        workout: "#FF375F",
        activity_summary: "#FF375F",
        timer: "#FF9230",
        heart_rate: "#FF4245",
        iot_control: "#00DAC3",
        map_navigation: "#6D7CFF",
        last_message: "#0091FF",
        sleep_summary: "#DB34F2",
        music_control: "#30D158",
        reminder: "#FFD600",
        checklist: "#B78A66"
      };

      const ACCENT_SURFACE_BY_CONTENT_TYPE = {
        weather: "#004559",
        upcoming_event: "#005459",
        workout: "#590012",
        activity_summary: "#590012",
        timer: "#592A00",
        heart_rate: "#590001",
        iot_control: "#005950",
        map_navigation: "#000959",
        last_message: "#003359",
        sleep_summary: "#4E0059",
        music_control: "#004D13",
        reminder: "#594B00",
        checklist: "#592800"
      };

      function explicitColorModeFromContext(context = {}) {
        const text = `${context.activity || ""} ${context.goal || ""}`.toLowerCase();
        if (/(multicolor|multi-color|colorful|different colors|varied colors|separate colors|more colors)/.test(text)) return "multicolor";
        if (/(mono[-\s]?tone|monotone|monochrome|single color|one color|same color)/.test(text)) return "mono_tone";
        return null;
      }

      function stableHash(value) {
        let hash = 2166136261;
        for (const char of String(value)) {
          hash ^= char.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function balancedColorModeForContext(context = {}, renderedContentTypes = []) {
        const seed = [
          [...renderedContentTypes].sort().join("|"),
          context.activity || "",
          context.goal || "",
          context.location || "",
          context.timeOfDay || ""
        ].join("::").toLowerCase();
        return stableHash(seed) % 2 === 0 ? "mono_tone" : "multicolor";
      }

      const CIRCULAR_SIZE_TOKENS = {
        S: {
          diameter: 72,
          strokeWidth: 8,
          radius: 31.5,
          center: { x: 36, y: 36 },

        return `${weekday} ${now.getDate()}`;

      function timeForFace(value) {
        const match = value.match(/(\d{1,2})(?::(\d{2}))?/);
        if (!match) return value;
        return `${match[1]}:${match[2] || "00"}`;
      }

      function splitTimeForFace(value) {
        const combined = timeForFace(value);
        const [hour, minute = "00"] = combined.split(":");
        return { combined, hour, minute };
      }

      function readContext() {
        return {

      function inferSelectedContentTypes(context) {
        const text = `${context.activity} ${context.goal}`.toLowerCase();
        const selected = [];

        if (/(checklist|shopping list|task list|packing list)/.test(text)) {
          return ["checklist"];
        }

        if (/(message|messages|text|texts|chat|dm|latest message|last message|unread|sender|reply)/.test(text)) {
          selected.push("last_message");
        }

        if (/(music|song|playlist|audio|podcast|playback)/.test(text)) {
          selected.push("music_control");
        }

        if (/(timer|countdown|pause|cancel|start timer|reset timer|set .*min|set .*minute|set .*hour|set .*sec)/.test(text)) {
          selected.push("timer");
        }

        if (/(remind|reminder|todo|to-do|complete task|mark complete)/.test(text)) {
          selected.push("reminder");
        }

        if (/(run|running|walk|workout|gym|exercise|mobility)/.test(text)) {
          selected.push("workout");
        }

        if (/(iot|device|thermostat|light|lights|lamp|lock|fan|ac|heater|temperature|turn on|turn off|set .*degree|set .*temp|control .*room|smart home)/.test(text)) {
          selected.push("iot_control");
        }

        if (/(dinner|meeting|appointment|pickup|commute|on time|schedule|call)/.test(text)) {
          selected.push("upcoming_event");
        }

        if (/(rain|weather|outside|outdoors|waterfront)/.test(text)) {
          selected.push("weather");
        }

        if (selected.length === 0) {
          selected.push("upcoming_event");
        }

        if (!selected.includes("weather") && !selected.includes("last_message") && selected.length < 3) {
          selected.push("weather");
        }

        return selected.slice(0, 3);

        const hasIotRectangle = selectedContentTypes.includes("iot_control") && shouldUseIotControlRectangle(context);
        const hasRectangularType = hasTimerRectangle || hasIotRectangle || selectedContentTypes.some((type) => !["workout", "timer", "heart_rate", "iot_control", "weather"].includes(type));
        if (selectedContentTypes.includes("checklist")) return "one-rectangular-widget";
        if (hasRectangularType && circularTypes.some((type) => (type !== "timer" || !hasTimerRectangle) && (type !== "iot_control" || !hasIotRectangle))) return "mixed-circular-and-rectangular-layout";
        if (hasRectangularType) return "one-rectangular-widget";
        if (circularTypes.length >= 3) return "three-compact-widgets";
        if (circularTypes.length >= 2) return "two-circular-widgets-with-compact-time";

          return [makeTimerRectangle(context)];

        if (shouldUseIotControlRectangle(context) && /(iot|device|thermostat|light|lights|lamp|lock|fan|ac|heater|temperature|turn on|turn off|smart home)/.test(`${context.activity} ${context.goal}`.toLowerCase())) {

        if (fallbackId === "three-compact-widgets" && selectedContentTypes.length === 1 && selectedContentTypes[0] === "weather") {

        if (fallbackId === "one-circular-widget-with-large-time") {

            makeWeatherWidget({ x: 18, y: 88, width: 72, height: 72 }, "S")

        if (fallbackId === "one-rectangular-widget") {
          return [makeEventRectangle(context)];

        if (fallbackId === "three-compact-widgets") {

            makeWorkoutWidget(context, { x: 127, y: 6, width: 72, height: 72 }, "S"),
            makeWeatherWidget({ x: 127, y: 89.5, width: 72, height: 72 }, "S"),

        return [

          makeEventRectangle(context)

      function makeValidationError(stage, code, path, message) {

      function estimateTextWidth(text, fontSize) {
        return String(text).length * fontSize * 0.58;
      }

      function estimateWrappedTextHeight(text, fontSize, lineHeight, width) {
        const safeWidth = Math.max(1, width);
        const lines = Math.max(1, Math.ceil(estimateTextWidth(text, fontSize) / safeWidth));
        return lines * lineHeight;
      }

      function estimateGeneratedRectangularBlockHeight(block, innerWidth) {
        if (!block || typeof block !== "object") return 0;
        if (block.type === "text") {
          const isNumber = block.unit === "numbers";
          return estimateWrappedTextHeight(block.text || "", isNumber ? 40 : 19, isNumber ? 42.5 : 21.5, innerWidth);
        }
        if (block.type === "inline_small_icon_text") {
          return Math.max(24, estimateWrappedTextHeight(block.text || "", 19, 21.5, innerWidth - 28));
        }
        if (block.type === "big_icon_text_group") {
          const textHeight = (block.textGroup || []).reduce((total, textBlock) => total + estimateGeneratedRectangularBlockHeight(textBlock, innerWidth - 56), 0);
          return Math.max(48, textHeight);
        }
        if (block.type === "number_text_lockup") {
          const secondaryHeight = block.secondaryText ? 4 + estimateWrappedTextHeight(block.secondaryText, 19, 21.5, innerWidth) : 0;
          return 42.5 + secondaryHeight;
        }
        if (block.type === "edge_progress_bar") return 12;
        return 0;
      }

      function estimateGeneratedRectangularContentHeight(widget) {
        const composition = widget?.composition;
        const blocks = Array.isArray(composition?.blocks) ? composition.blocks : [];
        const padding = composition?.padding || {};
        const innerWidth = 205 - (Number(padding.left) || 0) - (Number(padding.right) || 0);
        const blocksHeight = blocks.reduce((total, block) => total + estimateGeneratedRectangularBlockHeight(block, innerWidth), 0);
        const gap = Number(composition?.gap) || 0;
        return Math.ceil((Number(padding.top) || 0) + (Number(padding.bottom) || 0) + blocksHeight + Math.max(0, blocks.length - 1) * gap);

      function isBlank(value) {
        return value === undefined || value === null || String(value).trim() === "";
      }

      function hasWidgetOnSameRow(widgets, frame) {
        return (widgets || []).some((widget) => {
          if (!widget.frame) return false;
          return Math.max(0, Math.min(frame.y + frame.height, widget.frame.y + widget.frame.height) - Math.max(frame.y, widget.frame.y)) > 0;
        });
      }

      function horizontalOverlap(a, b) {
        return Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
      }

      function circularCorner(widget) {
        const frame = widget?.frame;
        if (!frame) return null;
        const left = frame.x <= 22;
        const right = frame.x + frame.width >= 183;
        const top = frame.y <= 22;
        const bottom = frame.y + frame.height >= 229;
        if (top && left) return "top_left";
        if (top && right) return "top_right";
        if (bottom && left) return "bottom_left";
        if (bottom && right) return "bottom_right";
        return null;
      }

      function oppositeCorners(a, b) {
        return (a === "top_left" && b === "bottom_right") ||
          (a === "bottom_right" && b === "top_left") ||
          (a === "top_right" && b === "bottom_left") ||
          (a === "bottom_left" && b === "top_right");
      }

      function splitTimeRequiredForWidgets(widgets = []) {
        const circularWidgets = widgets.filter((widget) => widget.shape === "circular");

        const smallCircular = circularWidgets.filter((widget) => widget.variant?.size === "S");
        if (smallOrMedium.length === 1) return true;
        if (circularWidgets.length === 2 && smallCircular.length === 2) {
          return oppositeCorners(circularCorner(circularWidgets[0]), circularCorner(circularWidgets[1]));
        }
        if (circularWidgets.length === 3 && smallCircular.length === 3) {
          const sorted = [...smallCircular].sort((a, b) => a.frame.y - b.frame.y);

          return sorted.every((widget) => Math.abs(widget.frame.x + widget.frame.width / 2 - centerX) <= 12);

        }
        if (layout.date?.stackGap !== 0 || layout.date?.edgePaddingWhenStackedFromEdge !== 16 || typeof layout.date?.stackedWithTimeContainerId !== "string") {

        }
        const dateTarget = (layout.time?.containers || []).find((container) => container.id === layout.date?.stackedWithTimeContainerId);
        if (dateTarget?.frame && layout.date?.frame) {
          const near = (a, b) => Math.abs(a - b) <= 1;
          const targetEdges = String(dateTarget.anchor || "").split("_");
          const targetIsCorner = targetEdges.some((edge) => ["top", "bottom"].includes(edge)) && targetEdges.some((edge) => ["left", "right"].includes(edge));
          const dateAbove = near(layout.date.frame.y + layout.date.frame.height + layout.date.stackGap, dateTarget.frame.y);
          const dateBelow = near(dateTarget.frame.y + dateTarget.frame.height + layout.date.stackGap, layout.date.frame.y);
          if (targetIsCorner && targetEdges.includes("top") && !dateBelow) {
            errors.push(makeValidationError("rule", "date_follows_corner_time", "date.frame.y", "when time is placed on a top corner, date must stack vertically after the time, away from the corner"));
          }
          if (targetIsCorner && targetEdges.includes("bottom") && !dateAbove) {
            errors.push(makeValidationError("rule", "date_follows_corner_time", "date.frame.y", "when time is placed on a bottom corner, date must stack vertically before the time, away from the corner"));
          }
          const dateTouchesTopCorner = near(layout.date.frame.y, 16) && (near(layout.date.frame.x, 16) || near(layout.date.frame.x + layout.date.frame.width, 205 - 16));
          const dateTouchesBottomCorner = near(layout.date.frame.y + layout.date.frame.height, 251 - 16) && (near(layout.date.frame.x, 16) || near(layout.date.frame.x + layout.date.frame.width, 205 - 16));
          if (dateTouchesTopCorner && !dateAbove) {
            errors.push(makeValidationError("rule", "time_follows_corner_date", "date.frame.y", "when date is placed on a top corner, time must stack vertically after the date, away from the corner"));
          }
          if (dateTouchesBottomCorner && !dateBelow) {
            errors.push(makeValidationError("rule", "time_follows_corner_date", "date.frame.y", "when date is placed on a bottom corner, time must stack vertically before the date, away from the corner"));
          }
        }

        const layoutUsesChecklistFullFace = layout.widgets?.some((widget) => widget.template === "checklist_full_face");
        for (const [path, textObject] of textObjectsForLayout(layout)) {
          if (!textObject?.frame || !textObject?.style) {
            errors.push(makeValidationError("schema", "missing_text_contract", path, `${path} must include frame and style`));
            continue;
          }
          if (textObject.frame.x < 0 || textObject.frame.y < 0 || textObject.frame.x + textObject.frame.width > 205 || textObject.frame.y + textObject.frame.height > 251) {
            errors.push(makeValidationError("rule", "frame_outside_canvas", `${path}.frame`, `${path} must fit inside the 205 x 251 canvas`));
          }
          if (!layoutUsesChecklistFullFace && estimateTextWidth(textObject.value, textObject.style.fontSize) > textObject.frame.width + 2) {
            errors.push(makeValidationError("rule", "text_overflow", `${path}.value`, `${path}.value is estimated to overflow its declared frame`));
          }
        }

        const largestTimeFont = Math.max(...(layout.time?.containers || [layout.time]).map((item) => item?.style?.fontSize || 0));
        const hasChecklistFullFace = layout.widgets?.some((widget) => widget.template === "checklist_full_face");
        if (!hasChecklistFullFace && layout.date?.style?.fontSize > largestTimeFont * 0.45) {
          errors.push(makeValidationError("rule", "date_not_secondary", "date.style.fontSize", "date must remain visually secondary to time"));
        }

        if (Array.isArray(layout.widgets)) {
          const rectangularWidgetCount = layout.widgets.filter((widget) => widget.shape === "rectangular").length;
          const hasChecklistWidget = layout.widgets.some((widget) => widget.contentType === "checklist");
          const contentTypeCounts = new Map();
          for (const widget of layout.widgets) {
            contentTypeCounts.set(widget.contentType, (contentTypeCounts.get(widget.contentType) || 0) + 1);
          }
          if (hasChecklistWidget && layout.widgets.length !== 1) {
            errors.push(makeValidationError("rule", "checklist_must_be_only_widget", "widgets", "checklist layouts must contain exactly one widget"));
          } else if (rectangularWidgetCount > 0 && layout.widgets.length > 2) {
            errors.push(makeValidationError("rule", "rectangular_present_widget_cap", "widgets", "rectangular-present layouts must contain at most two widgets"));
          }
          if (hasChecklistFullFace) {
            const checklistIndex = layout.widgets.findIndex((widget) => widget.template === "checklist_full_face");
            const checklist = layout.widgets[checklistIndex];
            const expectedWidgetFrame = { x: 0, y: 0, width: 205, height: 251 };
            const expectedDateFrame = { x: 16, y: 16, width: 70, height: 22 };
            const expectedTimeFrame = { x: 139, y: 16, width: 50, height: 22 };
            for (const key of ["x", "y", "width", "height"]) {
              if (checklist?.frame?.[key] !== expectedWidgetFrame[key]) {
                errors.push(makeValidationError("rule", "checklist_strict_frame", `widgets[${checklistIndex}].frame.${key}`, `checklist_full_face must occupy the Figma component frame; expected ${key}=${expectedWidgetFrame[key]}`));
              }
              if (layout.date?.frame?.[key] !== expectedDateFrame[key]) {
                errors.push(makeValidationError("rule", "checklist_date_slot", `date.frame.${key}`, `checklist_full_face date slot must match Figma; expected ${key}=${expectedDateFrame[key]}`));
              }
              if (layout.time?.frame?.[key] !== expectedTimeFrame[key]) {
                errors.push(makeValidationError("rule", "checklist_time_slot", `time.frame.${key}`, `checklist_full_face time slot must match Figma; expected ${key}=${expectedTimeFrame[key]}`));
              }
            }
            const timeContainer = layout.time?.containers?.[0];
            if (layout.time?.mode !== "single_line" || layout.time?.containers?.length !== 1) {
              errors.push(makeValidationError("rule", "checklist_time_single_slot", "time.mode", "checklist_full_face must use one compact time slot supplied to the component"));
            } else {
              for (const key of ["x", "y", "width", "height"]) {
                if (timeContainer?.frame?.[key] !== expectedTimeFrame[key]) {
                  errors.push(makeValidationError("rule", "checklist_time_slot", `time.containers[0].frame.${key}`, `checklist_full_face time container must match Figma; expected ${key}=${expectedTimeFrame[key]}`));
                }
              }
              if (timeContainer?.style?.fontSize !== 19 || timeContainer?.style?.fontWeight !== 400 || timeContainer?.style?.textAlign !== "right") {
                errors.push(makeValidationError("rule", "checklist_time_style", "time.containers[0].style", "checklist_full_face time slot must use SF Compact Regular 19pt and right-aligned text"));
              }
            }
            if (checklist?.verticalAlignment !== "top" || checklist?.surfaceMode !== "accent_surface") {
              errors.push(makeValidationError("rule", "checklist_component_contract", `widgets[${checklistIndex}]`, "checklist_full_face must use verticalAlignment top and surfaceMode accent_surface"));
            }
          }
          if (layout.widgets.length === 1 && layout.widgets[0].shape === "circular" && layout.widgets[0].variant?.size !== "L") {
            errors.push(makeValidationError("rule", "focused_single_circular_uses_large", "widgets[0].variant.size", "when the watch face focuses on one circular-supported widget, use the L circular size"));
          }
          if (splitTimeRequiredForWidgets(layout.widgets)) {
            if (layout.time?.mode !== "split_hour_minute" || layout.time?.containers?.length !== 2) {
              errors.push(makeValidationError("rule", "split_time_required_for_circular_layout", "time.mode", "split hour and minute into two vertically stacked containers for this circular-widget layout"));
            } else {
              const hour = layout.time.containers.find((container) => container.role === "hour") || layout.time.containers[0];
              const minute = layout.time.containers.find((container) => container.role === "minute") || layout.time.containers[1];
              const stackGap = Math.max(0, Math.max(hour.frame.y, minute.frame.y) - Math.min(hour.frame.y + hour.frame.height, minute.frame.y + minute.frame.height));
              if (horizontalOverlap(hour.frame, minute.frame) <= 0 || stackGap > 4) {
                errors.push(makeValidationError("rule", "split_time_vertical_stack", "time.containers", "split hour and minute containers must stack vertically with horizontal overlap"));
              }
              const availableColumnWidth = Math.max(hour.frame.width, minute.frame.width);
              const filledColumnWidth = Math.max(estimateTextWidth(hour.value, hour.style.fontSize), estimateTextWidth(minute.value, minute.style.fontSize));
              if (filledColumnWidth < availableColumnWidth * 0.55) {
                errors.push(makeValidationError("rule", "split_time_underfills_available_space", "time.containers", "when split time is required, increase hour and minute font sizes so they fill the remaining empty space"));
              }
            }
          }

          for (const [index, widget] of layout.widgets.entries()) {
            const path = `widgets[${index}]`;
            if (Array.isArray(layout.metadata?.selectedContentTypes) && !layout.metadata.selectedContentTypes.includes(widget.contentType)) {
              errors.push(makeValidationError("rule", "rendered_content_not_selected", `${path}.contentType`, `${path}.contentType must be one of metadata.selectedContentTypes`));
            }
            if (widget.frame?.x < 0 || widget.frame?.y < 0 || widget.frame?.x + widget.frame?.width > 205 || widget.frame?.y + widget.frame?.height > 251) {
              errors.push(makeValidationError("rule", "frame_outside_canvas", `${path}.frame`, `${path}.frame must fit inside the 205 x 251 canvas`));
            }
            if (widget.shape === "circular" && !["close_gauge", "open_gauge"].includes(widget.component)) {
              errors.push(makeValidationError("schema", "unknown_circular_component", `${path}.component`, `${path}.component is invalid`));
            }
            if (widget.shape === "circular" && !["S", "M", "L"].includes(widget.variant?.size)) {
              errors.push(makeValidationError("schema", "invalid_circular_size", `${path}.variant.size`, `${path}.variant.size is invalid`));
            }
            if (widget.shape === "circular") {
              const expectedCircularSize = { S: 72, M: 90, L: 150 }[widget.variant?.size];
              if (expectedCircularSize && (widget.frame?.width !== expectedCircularSize || widget.frame?.height !== expectedCircularSize)) {
                errors.push(makeValidationError("rule", "circular_fixed_size", `${path}.frame`, `${path}.frame must be ${expectedCircularSize}x${expectedCircularSize} for size ${widget.variant.size}`));
              }
              if (widget.component === "close_gauge" && widget.variant?.property === "text" && widget.data?.label !== undefined) {
                const footnoteToken = {
                  S: { fontSize: 10, width: 40 },
                  M: { fontSize: 15, width: 50 },
                  L: { fontSize: 18, width: 80 }
                }[widget.variant?.size];
                if (footnoteToken && estimateTextWidth(widget.data.label, footnoteToken.fontSize) > footnoteToken.width + 2) {
                  errors.push(makeValidationError("rule", "close_gauge_footnote_text_overflow", `${path}.data.label`, `${path}.data.label must fit the ${widget.variant.size} close_gauge footnote text box without clipping`));
                }
              }
              if (widget.component === "close_gauge" && widget.variant?.property === "text" && widget.data?.value !== undefined) {
                const centerValueToken = {
                  S: { fontSize: 22, width: 55 },
                  M: { fontSize: 32, width: 65 },
                  L: { fontSize: 42, width: 115 }
                }[widget.variant?.size];
                if (centerValueToken && estimateTextWidth(widget.data.value, centerValueToken.fontSize) > centerValueToken.width + 2) {
                  errors.push(makeValidationError("rule", "close_gauge_center_value_text_overflow", `${path}.data.value`, `${path}.data.value must fit the ${widget.variant.size} close_gauge center value text box without clipping`));
                }
              }
              if (widget.component === "close_gauge" && widget.variant?.property === "text" && contentTypeCounts.get(widget.contentType) === 1) {
                errors.push(makeValidationError("rule", "solo_close_gauge_prefers_icon", `${path}.variant.property`, "when close_gauge is the only widget for its content type, use the icon variant"));
              }
              if (widget.component === "close_gauge" && ["temperature", "current_temperature", "weather_temperature", "bpm", "heart_rate", "precipitation_probability", "rain_chance"].includes(widget.data?.metricKind)) {
                errors.push(makeValidationError("rule", "open_metric_uses_close_gauge", `${path}.component`, `${path} must use open_gauge because the metric moves within a range`));
              }
              if (widget.component === "open_gauge" && ["timer", "countdown", "workout", "activity", "activity_progress", "goal_progress"].includes(widget.data?.metricKind)) {
                errors.push(makeValidationError("rule", "close_metric_uses_open_gauge", `${path}.component`, `${path} must use close_gauge because the metric moves one direction`));
              }
              if (widget.component === "open_gauge") {
                if (widget.variant?.property === "icon" && isBlank(widget.data?.value)) {
                  errors.push(makeValidationError("schema", "missing_required", `${path}.data.value`, `${path}.data.value is required for open_gauge icon variant`));
                }
                if (widget.data?.value !== undefined) {
                  const centerValueToken = {
                    S: { fontSize: 22, width: 55 },
                    M: { fontSize: 32, width: 65 },
                    L: { fontSize: 48, width: 115 }
                  }[widget.variant?.size];
                  if (centerValueToken && estimateTextWidth(widget.data.value, centerValueToken.fontSize) > centerValueToken.width + 2) {
                    errors.push(makeValidationError("rule", "open_gauge_center_value_text_overflow", `${path}.data.value`, `${path}.data.value must fit the ${widget.variant.size} open_gauge center value text box without clipping`));
                  }
                }
                const bottomTextToken = {
                  S: { fontSize: 15, width: 48 },
                  M: { fontSize: 18, width: 60 },
                  L: { fontSize: 32, width: 96 }
                }[widget.variant?.size];
                const validateBottomText = (value, fieldPath) => {
                  if (isBlank(value)) {
                    errors.push(makeValidationError("schema", "missing_required", fieldPath, `${fieldPath} is required for visible open_gauge bottom content`));
                    return;
                  }
                  if (bottomTextToken && estimateTextWidth(value, bottomTextToken.fontSize) > bottomTextToken.width + 2) {
                    errors.push(makeValidationError("rule", "open_gauge_bottom_text_overflow", fieldPath, `${fieldPath} must fit the ${widget.variant.size} open_gauge bottom text box at ${bottomTextToken.fontSize}pt without clipping`));
                  }
                };
                if (widget.variant?.property === "text") validateBottomText(widget.data?.label, `${path}.data.label`);
                if (widget.variant?.property === "range") {
                  validateBottomText(widget.data?.lowLabel, `${path}.data.lowLabel`);
                  validateBottomText(widget.data?.highLabel, `${path}.data.highLabel`);
                }
                if (widget.variant?.property === "offset") validateBottomText(widget.data?.referenceValue, `${path}.data.referenceValue`);
                if (widget.variant?.property === "icon" && isBlank(widget.data?.icon)) {
                  errors.push(makeValidationError("schema", "missing_required", `${path}.data.icon`, `${path}.data.icon is required for visible open_gauge icon content`));
                }
              }
            }
            if (widget.shape === "rectangular") {
              if (!["music_control", "reminder", "timer_rectangular", "checklist_full_face", "generated_rectangular_widget"].includes(widget.template)) {
                errors.push(makeValidationError("schema", "unknown_rectangular_template", `${path}.template`, `${path}.template is invalid`));
              }
              if (widget.frame?.x !== 0 || widget.frame?.width !== 205) {
                errors.push(makeValidationError("rule", "rectangular_full_width", `${path}.frame`, `${path}.frame must be x=0 and width=205`));
              }
              if (widget.frame?.height < 108 || widget.frame?.height > 251) {
                errors.push(makeValidationError("rule", "rectangular_height_range", `${path}.frame.height`, `${path}.frame.height must be between 108 and 251`));
              }
              if (widget.template === "generated_rectangular_widget") {
                const requiredHeight = Math.max(108, estimateGeneratedRectangularContentHeight(widget));
                if (widget.frame?.height < requiredHeight) {
                  errors.push(makeValidationError("rule", "rectangular_content_height", `${path}.frame.height`, `${path}.frame.height must be at least ${requiredHeight}px to fit generated rectangular content`));
                }
              }
              if (widget.cornerRadius !== 54 || widget.cornerSmoothing !== 60) {
                errors.push(makeValidationError("rule", "rectangular_corner_treatment", path, `${path} must use cornerRadius 54 and cornerSmoothing 60`));
              }
              if (!["black_surface", "accent_surface"].includes(widget.surfaceMode)) {
                errors.push(makeValidationError("schema", "invalid_rectangular_surface_mode", `${path}.surfaceMode`, `${path}.surfaceMode must be black_surface or accent_surface`));
              }
              if (widget.contentType === "last_message" && Array.isArray(widget.composition?.blocks)) {
                widget.composition.blocks.forEach((block, blockIndex) => {
                  if (block?.type === "inline_small_icon_text" && blockIndex !== 0) {
                    errors.push(makeValidationError("rule", "last_message_content_has_icon", `${path}.composition.blocks[${blockIndex}]`, "message content must render as plain text without an icon; only sender metadata may use an optional icon"));
                  }
                });
              }
            }
          }

          const rectangularWidgets = layout.widgets.filter((widget) => widget.shape === "rectangular" && widget.template !== "checklist_full_face");
          const accentSurfaceWidgets = rectangularWidgets.filter((widget) => widget.surfaceMode === "accent_surface");
          if (accentSurfaceWidgets.length > 1) {
            errors.push(makeValidationError("rule", "too_many_rectangular_accent_surfaces", "widgets", "Only the most important rectangular widget may use accent_surface"));
          }
          if (rectangularWidgets.length > 0 && rectangularWidgets[0].surfaceMode !== "accent_surface") {
            const primaryRectIndex = layout.widgets.findIndex((widget) => widget.id === rectangularWidgets[0].id);
            errors.push(makeValidationError("rule", "primary_rectangular_missing_accent_surface", `widgets[${primaryRectIndex}].surfaceMode`, "The primary rectangular widget should use accent_surface"));
          }

          for (let index = 0; index < layout.widgets.length; index += 1) {
            for (let nextIndex = index + 1; nextIndex < layout.widgets.length; nextIndex += 1) {
              const a = layout.widgets[index];
              const b = layout.widgets[nextIndex];
              if (a.template === "checklist_full_face" || b.template === "checklist_full_face") continue;
              const xOverlap = Math.max(0, Math.min(a.frame.x + a.frame.width, b.frame.x + b.frame.width) - Math.max(a.frame.x, b.frame.x));
              const yOverlap = Math.max(0, Math.min(a.frame.y + a.frame.height, b.frame.y + b.frame.height) - Math.max(a.frame.y, b.frame.y));
              if (xOverlap > 0 && yOverlap > 0) {
                errors.push(makeValidationError("rule", "widget_widget_overlap", `widgets[${nextIndex}].frame`, `${a.id} and ${b.id} overlap; only time/widget overlap is allowed`));
              }
            }
          }

          const circularWidgets = layout.widgets.filter((widget) => widget.shape === "circular");
          if (layout.widgets.length === 3 && circularWidgets.length === 3) {
            const sorted = [...circularWidgets].sort((a, b) => a.frame.y - b.frame.y);
            const centerX = sorted[0].frame.x + sorted[0].frame.width / 2;
            for (const widget of sorted) {
              if (Math.abs(widget.frame.x + widget.frame.width / 2 - centerX) > 12) {
                errors.push(makeValidationError("rule", "three_circular_vertical_stack", `${widget.id}.frame.x`, "three circular widgets must stack vertically in one column"));
              }
            }
          }

          for (const [path, textObject] of textObjectsForLayout(layout)) {
            if (!textObject?.frame) continue;
            for (const widget of layout.widgets) {
              if (widget.template === "checklist_full_face") continue;
              const xOverlap = Math.max(0, Math.min(textObject.frame.x + textObject.frame.width, widget.frame.x + widget.frame.width) - Math.max(textObject.frame.x, widget.frame.x));
              const yOverlap = Math.max(0, Math.min(textObject.frame.y + textObject.frame.height, widget.frame.y + widget.frame.height) - Math.max(textObject.frame.y, widget.frame.y));
              if (path === "date" && xOverlap > 0 && yOverlap > 0) {
                errors.push(makeValidationError("rule", "widget_date_overlap", `${path}.frame`, `date overlaps ${widget.id}; only time/widget overlap is allowed`));
                continue;
              }
              const overlapDepth = rectOverlapDepth(textObject.frame, widget.frame);
              if (overlapDepth > 10) {
                errors.push(makeValidationError("rule", "widget_text_overlap_exceeds_limit", `${path}.frame`, `${path} overlaps ${widget.id} by ${Math.round(overlapDepth)}px`));
              }
            }
          }
        }

        return {
          ok: errors.length === 0,
          stage: errors.some((item) => item.stage === "schema") ? "schema" : errors.length > 0 ? "rule" : "accepted",
          summary: errors.length === 0 ? "layout accepted by Phase 6 local validation" : `${errors.length} validation error${errors.length === 1 ? "" : "s"}`,
          errors,
          warnings
        };
      }

      function buildPipelineRun(reason) {
        const startedAt = performance.now();
        const context = readContext();
        const pseudoContextSummary = [
          "Fictional busy active user based in Kirkland, WA.",
          "Past context includes schedule, weather-aware planning, workouts, errands, commute, and evening routines."
        ];
        const selectedContentTypes = inferSelectedContentTypes(context);
        const fallbackReason = fallbackReasonFromContext(context);
        const widgetSelection = chooseWidgets(selectedContentTypes, context);
        const widgets = widgetSelection.widgets;
        const fallbackId = fallbackIdFromWidgets(widgets);
        const layout = buildMockLayout(context, selectedContentTypes, widgets, {
          fallbackUsed: true,
          fallbackId,
          fallbackReason
        });
        const elapsedMs = Math.round(performance.now() - startedAt);
        const widgetDecisions = widgets.map((widget) => widget.decision);
        const renderedContentTypes = new Set(widgets.map((widget) => widget.contentType));
        for (const contentType of widgetSelection.omittedContentTypes || selectedContentTypes) {
          if (!renderedContentTypes.has(contentType)) {
            const omittedByComposition = selectedContentTypes.some((type) => widgets.some((widget) => widget.contentType === type && widget.shape === "rectangular"));
            widgetDecisions.push(omittedByComposition ? omittedByCompositionDecision(contentType) : deferredWidgetDecision(contentType));
          }
        }
        const validation = validateLocalLayout(layout);
        const model = {
          provider: layout.metadata.provider,
          model: layout.metadata.model,
          promptVersion: layout.metadata.promptVersion,
          schemaVersion: layout.metadata.schemaVersion,
          latencyMs: elapsedMs,
          estimatedCost: "n/a"
        };
        const pipelineSteps = [
          { id: "read-live-context", status: "complete", detail: `time=${context.timeOfDay}; location=${context.location}; activity=${context.activity}; goal=${context.goal || "none"}` },
          { id: "load-pseudo-context", status: "mocked", detail: pseudoContextSummary.join(" ") },
          { id: "select-content-types", status: "complete", detail: selectedContentTypes.join(", ") },
          { id: "choose-fallback-layout", status: "complete", detail: `${fallbackId}; ${fallbackReasonLabel(fallbackReason)}` },
          { id: "choose-widgets", status: "complete", detail: widgetDecisions.join(" | ") },
          { id: "populate-widgets", status: "complete", detail: "Fallback widget data and semantic icon tokens populated from live context plus pseudo-context summary." },
          { id: "generate-layout-json", status: "complete", detail: "Generated schema-shaped Phase 7 fallback layout JSON as the final render contract." },
          { id: "validate", status: validation.ok ? "accepted" : "failed", detail: validation.summary },
          { id: "render", status: validation.ok ? "pending" : "blocked", detail: validation.ok ? "Awaiting accepted layout render." : "Render blocked because local validation failed." }
        ];

        return {
          generationId: `phase-7-${Date.now()}`,
          reason,
          context,
          pseudoContextSummary,
          selectedContentTypes,
          widgetDecisions,
          layout,
          validation,
          model,
          validationAttempts: [],
          pipelineSteps
        };
      }

      function buildRunFromApiResponse(result, context, reason) {
        return {
          generationId: `phase-8-${Date.now()}`,
          reason,
          context,
          pseudoContextSummary: result.pseudoContextSummary || ["Loaded by backend endpoint."],
          selectedContentTypes: result.selectedContentTypes || result.layout?.metadata?.selectedContentTypes || [],
          widgetDecisions: result.widgetDecisions || [],
          layout: result.layout,
          validation: result.validation,
          model: result.model || {
            provider: result.layout?.metadata?.provider || "local-backend",
            model: "none",
            promptVersion: result.layout?.metadata?.promptVersion || "watch-face-phase-8-backend-fallback",
            schemaVersion: result.layout?.schemaVersion || "1.0.0",
            latencyMs: 0,
            estimatedCost: "n/a"
          },
          validationAttempts: result.validationAttempts || [],
          renderInvalidModelResult: Boolean(result.renderInvalidModelResult),
          pipelineSteps: result.logs || []
        };
      }

      async function requestBackendGeneration(context) {
        let response;
        try {
          response = await fetch("/api/generate-watch-ui", {
            method: "POST",
            headers: {
              "content-type": "application/json"
            },
            body: JSON.stringify({
              context,
              currentTime: new Date().toISOString(),
              currentDate: new Date().toLocaleDateString("en-US"),
              preferences: {}
            })
          });
        } catch (error) {
          const networkError = new Error(error.message || "Could not connect to backend endpoint");
          networkError.kind = "network";
          throw networkError;
        }

        let result;
        try {
          result = await response.json();
        } catch (error) {
          result = null;
        }
        if (!response.ok) {
          const summary = result?.validation?.summary || `backend returned ${response.status}`;
          const backendError = new Error(summary);
          backendError.kind = result?.validation?.ok === false ? "validation" : response.status >= 500 ? "server" : "request";
          backendError.status = response.status;
          backendError.result = result;
          throw backendError;
        }
        if (!result) {
          const parseError = new Error("backend returned a non-JSON response");
          parseError.kind = "server";
          parseError.status = response.status;
          throw parseError;
        }
        return result;
      }

      function buildSampleRun(layout, index) {
        const context = readContext();
        const pseudoContextSummary = [
          "Loaded from design-pack/sample-layouts.json.",
          "This bypasses content inference and exercises the deterministic Phase 6 validator and renderer."
        ];
        const widgetDecisions = layout.widgets.map((widget) => {
          if (widget.shape === "circular") {
            return `${widget.contentType} -> ${widget.component} ${widget.variant.property} ${widget.variant.size} from hand-authored sample ${index + 1}`;
          }
          return `${widget.contentType} -> ${widget.template} from hand-authored sample ${index + 1}`;
        });
        const validation = validateLocalLayout(layout);
        const model = {
          provider: "local-sample",
          model: "none",
          promptVersion: layout.metadata?.promptVersion || "watch-face-sample-v1",
          schemaVersion: layout.schemaVersion,
          latencyMs: 0,
          estimatedCost: "n/a"
        };
        return {
          generationId: `phase-6-sample-${Date.now()}`,
          reason: `Loaded hand-authored sample layout ${index + 1}.`,
          context,
          pseudoContextSummary,
          selectedContentTypes: layout.metadata?.selectedContentTypes || [],
          widgetDecisions,
          layout,
          validation,
          model,
          validationAttempts: [],
          pipelineSteps: [
            { id: "load-sample-layouts", status: "complete", detail: "Fetched design-pack/sample-layouts.json as a static asset." },
            { id: "select-sample-layout", status: "complete", detail: `Selected sample layout ${index + 1}.` },
            { id: "generate-layout-json", status: "complete", detail: "Used hand-authored sample JSON as the final render contract." },
            { id: "validate", status: validation.ok ? "accepted" : "failed", detail: validation.summary },
            { id: "render", status: validation.ok ? "pending" : "blocked", detail: validation.ok ? "Awaiting accepted sample render." : "Render blocked because local validation failed." }
          ]
        };
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function polarToCartesian(center, radius, angleDegrees) {
        const radians = (angleDegrees * Math.PI) / 180;
        return {
          x: center.x + radius * Math.cos(radians),
          y: center.y + radius * Math.sin(radians)
        };
      }

      function describeArc(center, radius, startAngle, sweepAngle) {
        const endAngle = startAngle + sweepAngle;
        const start = polarToCartesian(center, radius, startAngle);
        const end = polarToCartesian(center, radius, endAngle);
        const largeArcFlag = Math.abs(sweepAngle) > 180 ? 1 : 0;
        return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
      }

      function createSvgElement(name, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        return element;
      }

      function createElement(name, className, text) {
        const element = document.createElement(name);
        if (className) {
          element.className = className;
        }
        if (text !== undefined) {
          element.textContent = String(text);
        }
        return element;
      }

      function applyFrame(element, frame) {
        element.style.left = `${frame.x}px`;
        element.style.top = `${frame.y}px`;
        element.style.width = `${frame.width}px`;
        element.style.height = `${frame.height}px`;
      }

      function applyTextBox(element, token, color) {
        element.style.left = `${token.box.x}px`;
        element.style.top = `${token.box.y}px`;
        element.style.width = `${token.box.width}px`;
        element.style.height = `${token.box.height}px`;
        element.style.fontSize = `${token.fontSize}px`;
        element.style.lineHeight = `${token.box.height}px`;
        element.style.color = color;
        if (token.align) {
          element.style.justifyContent = token.align === "left" ? "flex-start" : token.align === "right" ? "flex-end" : "center";
        }
      }

      function accentFor(widget, colorSystem) {
        if (colorSystem?.mode === "mono_tone" && colorSystem.accentColor) {
          return colorSystem.accentColor;
        }
        return ACCENT_BY_CONTENT_TYPE[widget.contentType] || "#D94C00";
      }

      function accentSurfaceFor(widget, colorSystem) {
        if (colorSystem?.mode === "mono_tone" && colorSystem.surfaceAccentColor) {
          return colorSystem.surfaceAccentColor;
        }
        return ACCENT_SURFACE_BY_CONTENT_TYPE[widget.contentType] || "#592A00";
      }

      function hexToRgb(hex) {
        const normalized = hex.replace("#", "");
        const value = Number.parseInt(normalized.length === 3 ? normalized.split("").map((char) => char + char).join("") : normalized, 16);
        return {
          r: (value >> 16) & 255,
          g: (value >> 8) & 255,
          b: value & 255
        };
      }

      function rgbToHex({ r, g, b }) {
        return `#${[r, g, b].map((value) => Math.round(clamp(value, 0, 255)).toString(16).padStart(2, "0")).join("")}`;
      }

      function mixHex(start, end, amount) {
        const a = hexToRgb(start);
        const b = hexToRgb(end);
        return rgbToHex({
          r: a.r + (b.r - a.r) * amount,
          g: a.g + (b.g - a.g) * amount,
          b: a.b + (b.b - a.b) * amount
        });
      }

      function shiftColor(hex, amount) {
        return mixHex(hex, amount >= 0 ? "#FFFFFF" : "#000000", Math.abs(amount));
      }

      function rgbaFromHex(hex, opacity) {
        const rgb = hexToRgb(hex);
        return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacity})`;
      }

      function rectangularColorsFor(widget, colorSystem) {
        const accent = accentFor(widget, colorSystem);
        const surfaceAccent = accentSurfaceFor(widget, colorSystem);
        if (widget.surfaceMode === "accent_surface") {
          return {
            accent,
            background: surfaceAccent,
            primary: "#FFFFFF",
            secondary: "rgba(242, 244, 252, 0.6)",
            icon: "#FFFFFF",
            progress: "#FFFFFF",
            radioStroke: "rgba(242, 244, 252, 0.6)",
            radioSelected: "#FFFFFF"
          };
        }
        return {
          accent,
          background: "#000000",
          primary: accent,
          secondary: rgbaFromHex(accent, 0.6),
          icon: accent,
          progress: accent,
          radioStroke: "rgba(242, 244, 252, 0.6)",
          radioSelected: "#F2F4FC"
        };
      }

      function colorsForWidget(widget, colorSystem) {
        const accent = accentFor(widget, colorSystem);
        if (widget.component === "open_gauge" && colorSystem?.mode === "multicolor") {
          return {
            accent,
            start: shiftColor(accent, 0.24),
            end: shiftColor(accent, -0.16),
            set: shiftColor(accent, 0.18),
            offset: shiftColor(accent, -0.12),
            usesGradient: true
          };
        }
        return {
          accent,
          start: accent,
          end: accent,
          set: accent,
          offset: accent,
          usesGradient: false
        };
      }

      function normalizeMetricValue(widget) {
        if (typeof widget.data.progress === "number") {
          return clamp(widget.data.progress, 0, 1);
        }
        const numericValue = Number.parseFloat(widget.data.measuredValue ?? widget.data.value);
        const min = Number(widget.data.min ?? 0);
        const max = Number(widget.data.max ?? 100);
        if (Number.isFinite(numericValue) && Number.isFinite(min) && Number.isFinite(max) && max !== min) {
          return clamp((numericValue - min) / (max - min), 0, 1);
        }
        return 0.5;
      }

      function renderMaterialIcon(token, size, color) {
        const icon = createElement("span", "watch-symbol", MATERIAL_SYMBOLS[token] || token || "help");
        icon.style.fontSize = `${size}px`;
        icon.style.color = color;
        icon.setAttribute("aria-hidden", "true");
        return icon;
      }

      function appendCloseGaugeContent(container, widget, sizeToken, color) {
        if (widget.variant.property === "icon") {
          const box = createElement("div", "gauge-text gauge-icon");
          applyTextBox(box, { ...sizeToken.iconBox, box: sizeToken.iconBox, fontSize: sizeToken.iconBox.width }, color);
          box.append(renderMaterialIcon(widget.data.icon, sizeToken.iconBox.width, color));
          container.append(box);
          return;
        }

        const value = createElement("div", "gauge-text gauge-value", widget.data.value);
        applyTextBox(value, sizeToken.closeText.value, color);
        container.append(value);
        if (widget.data.label !== undefined && widget.data.label !== null) {
          const footnote = createElement("div", "gauge-text gauge-label", widget.data.label);
          applyTextBox(footnote, sizeToken.closeText.footnote, color);
          container.append(footnote);
        }
      }

      function appendOpenGaugeContent(container, widget, sizeToken, colors, normalized) {
        const color = widget.variant.property === "offset" ? colors.offset : mixHex(colors.start, colors.end, normalized);
        if (widget.variant.property === "icon") {
          const current = createElement("div", "gauge-text gauge-value", widget.data.value);
          applyTextBox(current, sizeToken.openText.current, color);
          container.append(current);

          const box = createElement("div", "gauge-text gauge-icon");
          applyTextBox(box, { ...sizeToken.openIconBox, box: sizeToken.openIconBox, fontSize: sizeToken.openIconBox.width }, color);
          box.append(renderMaterialIcon(widget.data.icon, sizeToken.openIconBox.width, color));
          container.append(box);
          return;
        }

        const current = createElement("div", "gauge-text gauge-value", widget.data.value);
        applyTextBox(current, sizeToken.openText.current, color);
        container.append(current);

        if (widget.variant.property === "text" && widget.data.label) {
          const label = createElement("div", "gauge-text gauge-label", widget.data.label);
          applyTextBox(label, sizeToken.openText.reference, color);
          container.append(label);
        }

        if (widget.variant.property === "range") {
          const low = createElement("div", "gauge-text", widget.data.lowLabel ?? widget.data.min);
          applyTextBox(low, sizeToken.openText.low, colors.start);
          const high = createElement("div", "gauge-text", widget.data.highLabel ?? widget.data.max);
          applyTextBox(high, sizeToken.openText.high, colors.end);
          container.append(low, high);
        }

        if (widget.variant.property === "offset" && widget.data.referenceValue !== undefined) {
          const reference = createElement("div", "gauge-text", widget.data.referenceValue);
          applyTextBox(reference, sizeToken.openText.reference, colors.set);
          container.append(reference);
        }
      }

      function normalizedMetricFromValue(widget, rawValue) {
        const numericValue = Number.parseFloat(rawValue);
        const min = Number(widget.data.min ?? 0);
        const max = Number(widget.data.max ?? 100);
        if (Number.isFinite(numericValue) && Number.isFinite(min) && Number.isFinite(max) && max !== min) {
          return clamp((numericValue - min) / (max - min), 0, 1);
        }
        return 0.5;
      }

      function appendOpenGaugeDot(svg, sizeToken, normalized, fill) {
        const angle = 135 + normalized * 270;
        const point = polarToCartesian(sizeToken.center, sizeToken.radius, angle);
        svg.append(createSvgElement("circle", {
          cx: point.x,
          cy: point.y,
          r: sizeToken.measureDot.diameter / 2,
          fill,
          stroke: "#000",
          "stroke-width": sizeToken.measureDot.strokeWidth
        }));
      }

      function renderCircularWidget(widget, layout) {
        if (!["close_gauge", "open_gauge"].includes(widget.component)) {
          throw new Error(`Unknown circular component: ${widget.component}`);
        }
        if (!CIRCULAR_SIZE_TOKENS[widget.variant?.size]) {
          throw new Error(`Unknown circular size: ${widget.variant?.size}`);
        }

        const sizeToken = CIRCULAR_SIZE_TOKENS[widget.variant.size];
        const colors = colorsForWidget(widget, layout?.colorSystem);
        const color = colors.accent;
        const container = createElement("div", "watch-widget circular-widget");
        applyFrame(container, widget.frame);
        container.style.color = color;

        const svg = createSvgElement("svg", {
          viewBox: `0 0 ${sizeToken.diameter} ${sizeToken.diameter}`,
          role: "img",
          "aria-label": `${widget.contentType} ${widget.component}`
        });

        if (widget.component === "close_gauge") {
          const circumference = 2 * Math.PI * sizeToken.radius;
          const progress = normalizeMetricValue(widget);
          svg.append(
            createSvgElement("circle", {
              cx: sizeToken.center.x,
              cy: sizeToken.center.y,
              r: sizeToken.radius,
              fill: "none",
              stroke: "rgba(140, 140, 140, 0.28)",
              "stroke-width": sizeToken.strokeWidth,
              "stroke-linecap": "round"
            }),
            createSvgElement("circle", {
              cx: sizeToken.center.x,
              cy: sizeToken.center.y,
              r: sizeToken.radius,
              fill: "none",
              stroke: color,
              "stroke-width": sizeToken.strokeWidth,
              "stroke-linecap": "round",
              "stroke-dasharray": `${circumference * 0.833} ${circumference}`,
              "stroke-dashoffset": `${circumference * 0.833 * (1 - progress)}`,
              transform: `rotate(-90 ${sizeToken.center.x} ${sizeToken.center.y})`
            })
          );
          container.append(svg);
          appendCloseGaugeContent(container, widget, sizeToken, color);
          return container;
        }

        const normalized = normalizeMetricValue(widget);
        let progressStroke = color;
        if (colors.usesGradient) {
          const gradientId = `${widget.id || "open-gauge"}-gradient`;
          const defs = createSvgElement("defs");
          const gradient = createSvgElement("linearGradient", {
            id: gradientId,
            x1: "0%",
            y1: "100%",
            x2: "100%",
            y2: "100%"
          });
          gradient.append(
            createSvgElement("stop", { offset: "0%", "stop-color": widget.variant.property === "offset" ? colors.set : colors.start }),
            createSvgElement("stop", { offset: "100%", "stop-color": widget.variant.property === "offset" ? colors.offset : colors.end })
          );
          defs.append(gradient);
          svg.append(defs);
          progressStroke = `url(#${gradientId})`;
        }
        const trackPath = describeArc(sizeToken.center, sizeToken.radius, 135, 270);
        const progressPath = describeArc(sizeToken.center, sizeToken.radius, 135, 270 * normalized);
        svg.append(
          createSvgElement("path", {
            d: trackPath,
            fill: "none",
            stroke: "#3D3D3D",
            "stroke-width": sizeToken.strokeWidth,
            "stroke-linecap": "round"
          }),
          createSvgElement("path", {
            d: progressPath,
            fill: "none",
            stroke: progressStroke,
            "stroke-width": sizeToken.strokeWidth,
            "stroke-linecap": "round"
          })
        );

        if (widget.variant.property === "range") {
          appendOpenGaugeDot(svg, sizeToken, normalized, mixHex(colors.start, colors.end, normalized));
        }

        if (widget.variant.property === "offset") {
          appendOpenGaugeDot(svg, sizeToken, normalizedMetricFromValue(widget, widget.data.referenceMeasuredValue ?? widget.data.referenceValue), colors.set);
          appendOpenGaugeDot(svg, sizeToken, normalizedMetricFromValue(widget, widget.data.measuredValue ?? widget.data.value), colors.offset);
        }

        container.append(svg);
        appendOpenGaugeContent(container, widget, sizeToken, colors, normalized);
        return container;
      }

      function renderControlIcon(name, color = "#F2F4FC") {
        const symbolByName = {
          previous: "skip_previous",
          play: "play_arrow",
          playPause: "pause",
          next: "skip_next",
          reset: "restart_alt",
          startPause: "pause",
          cancel: "close"
        };
        const button = createElement("div", "rect-control");
        button.append(renderMaterialIcon(symbolByName[name], 28, color));
        return button;
      }

      function renderRadioButton(checked = false) {
        const radio = createElement("span", "rect-radio");
        const ring = createElement("span", "rect-radio-ring");
        if (checked) {
          ring.append(createElement("span", "rect-radio-dot"));
        }
        radio.append(ring);
        return radio;
      }

      function renderGeneratedTextBlock(block) {
        const classByUnit = {
          numbers: "rect-number",
          body_emphasis: "rect-primary",
          body: "rect-secondary",
          secondary: "rect-secondary"
